<!-- @dsCard group="Components" viewport="700x340" name="Feedback — bandeaux et accusés" subtitle="Quatre intentions, plus l'accusé d'action" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.417.0/dist/umd/lucide.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../components/_card-boot.js"></script>
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-body); background: var(--surface-page);
         color: var(--text-body); padding: 18px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .col { display: grid; gap: 10px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; }
  .pair .pane:last-child :where([role="status"]) { position: static; box-shadow: none; }
  .pane { padding: 16px 18px; }
  .lbl { font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
         font-weight: 600; color: var(--text-mention); margin-bottom: 10px; }
</style>
</head>
<body style="padding:0">
<div id="root"></div>
<script type="text/lehno">
const C = await window.lehnoBoot(["../core/Icon.jsx","./Banner.jsx","./Toast.jsx"]);
const { Banner, Toast } = C;
const msgs = [
  ["info", "Votre Mur est visible par toute personne ayant le lien."],
  ["success", "Message envoyé à Valery."],
  ["warning", "Il vous reste un crédit."],
  ["error", "Ce lien n'est plus valable."]
];
const Stack = () => <div className="col" style={{ gap: 8 }}>
  {msgs.map(([i, t]) => <Banner key={i} intent={i}>{t}</Banner>)}
</div>;
function Demo() {
  return (
    <div className="pair">
      <div className="pane"><div className="lbl">Thème clair</div><Stack /></div>
      <div className="pane lehno-nuit" style={{ background: "var(--surface-page)", color: "var(--text-body)" }}>
        <div className="lbl">Thème sombre</div><Stack />
      </div>
      <div className="pane" style={{ gridColumn: "1 / -1", borderTop: "1px solid var(--border-hairline)" }}>
        <div className="lbl">Accusé d'action — s'efface seul, laisse une sortie</div>
        <Toast action="Annuler" duree={0}>Solde de valentine ajusté de +2 crédits.</Toast>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
