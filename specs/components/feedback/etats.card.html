<!-- @dsCard group="Components" viewport="760x400" name="États — vide, attente, hors connexion" subtitle="Traités comme du contenu, pas comme des accidents" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.417.0/dist/umd/lucide.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../components/_card-boot.js"></script>
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-body); background: var(--surface-page); color: var(--text-body); padding: 18px 20px; }
  .trio { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; align-items: start; }
  .lbl { font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
         font-weight: 600; color: var(--text-mention); margin-bottom: 10px; }
  .box { border: 1px solid var(--border-hairline); border-radius: 14px; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/lehno">
const C = await window.lehnoBoot(["../core/Icon.jsx","../core/Button.jsx","../core/Tag.jsx","../core/Card.jsx","../core/SectionLabel.jsx","../core/Avatar.jsx","../content/Countdown.jsx","../content/Provenance.jsx","../content/Quote.jsx","../content/EventCard.jsx","../content/CategoryTag.jsx","../content/CreditIndicator.jsx","../feedback/Banner.jsx","../feedback/SensitiveBanner.jsx","../feedback/PaidActionSheet.jsx","../feedback/EmptyState.jsx","../feedback/LoadingState.jsx","../feedback/OfflineBanner.jsx","../navigation/NotificationBell.jsx"]);
const { EmptyState, LoadingState, OfflineBanner } = C;
function Demo() {
  return (
    <div>
      <div className="trio">
        <div>
          <div className="lbl">Vide — premier lancement</div>
          <div className="box">
            <EmptyState icone="calendar-plus" titre="Commencez par une date"
              texte="Un anniversaire, un mariage, six mois d'une histoire. Le reste se remplit tout seul."
              action="Ajouter une date" />
          </div>
        </div>
        <div>
          <div className="lbl">Vide — rien d'imminent</div>
          <div className="box">
            <EmptyState titre="Rien avant le 24 août"
              texte="Vous avez le temps. Notez ce qui vous vient d'ici là."
              action="Laisser une note" />
          </div>
        </div>
        <div>
          <div className="lbl">Attente — la génération</div>
          <div className="box">
            <LoadingState variant="generation" onQuitter={() => {}} />
          </div>
        </div>
      </div>
      <div className="trio" style={{ marginTop: 22 }}>
        <div>
          <div className="lbl">Attente — une liste</div>
          <LoadingState variant="liste" lignes={2} />
        </div>
        <div>
          <div className="lbl">Attente — un envoi</div>
          <LoadingState variant="envoi" />
          <div style={{ marginTop: 14 }} className="lbl">Hors connexion</div>
          <OfflineBanner />
        </div>
        <div>
          <div className="lbl">Hors connexion — file d'attente</div>
          <OfflineBanner enAttente={2} />
          <div style={{ fontSize: 11.5, color: "var(--text-mention)", marginTop: 12, lineHeight: 1.45 }}>
            Lilas, pas ambre : perdre le réseau n'est pas une faute de l'utilisateur.
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
