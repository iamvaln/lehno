/* Le même identifiant d'état ne dit pas la même chose partout : « liste » est
   une vue sur Dates et une wishlist sur une surface publique. L'écran a donc le
   dernier mot sur le libellé, et le dictionnaire général sert de repli. */
const ETIQ_ECRAN = {
  dates:     { liste: { fr: "Vue liste", en: "List view" } },
  identite:  { collecte: { fr: "Née d'une collecte", en: "From a collection" } },
  code:      { expire: { fr: "Code expiré", en: "Expired code" } },
  paiement:  { expire: { fr: "Carte expirée", en: "Card expired" } },
  recharge:  { attente: { fr: "Attente mobile money", en: "Mobile money wait" } },
  collecte:  { revoque: { fr: "Lien révoqué", en: "Revoked link" } },
  monmur:    { prive: { fr: "Mur non publié", en: "Wall unpublished" } },
  souhait:   { horsligne: { fr: "Hors connexion", en: "Offline" } }
};

const nomEtat = (ecranId, k, langue) => {
  const par = ETIQ_ECRAN[ecranId];
  if (par && par[k]) return par[k][langue];
  return (ETIQUETTES[langue] || {})[k] || k;
};

/* Chaque surface publique dépend de son drapeau : l'aperçu visiteur reste
   ouvert tant qu'une seule de ses pages existe, mais il ne propose que les
   pages ouvertes. */
const ETAT_DRAPEAU = {
  surface: { voeu: "wishes", voeuxclos: "wishes", mur: "wall",
    liste: "wishlistOwn", connecte: "wishlistOwn",
    collecte: "collect", revoque: "collect" }
};
const etatsOuverts = (ecr, flags) => {
  const carte = ETAT_DRAPEAU[ecr.id];
  if (!carte) return ecr.etats;
  const gardes = ecr.etats.filter((k) => !carte[k] || flags[carte[k]] !== false);
  return gardes.length ? gardes : ecr.etats;
};

function App() {
  const [ecranId, setEcranId] = React.useState("accueil");
  const [etat, setEtat] = React.useState("nominal");
  const [nuit, setNuit] = React.useState(false);
  const [langue, setLangue] = React.useState("fr");
  const [modele, setModele] = React.useState("standard");
  const [profil, setProfil] = React.useState("tout");
  const [os, setOs] = React.useState("ios");
  const [notation, setNotation] = React.useState("barre");
  const [feuille, setFeuille] = React.useState(null);
  /* Le retrait d'un souhait : ce qu'il emporte dépend de l'état, et l'écran
     n'apprend l'issue qu'une fois accordée. */
  const [retrait, setRetrait] = React.useState(null);
  /* Le sujet du clic, retenu jusqu'au détail : c'est ce qui manquait pour que
     toucher Célarine ouvre la fiche d'Célarine. */
  const [sujet, setSujet] = React.useState(null);
  /* La charge du clic, au-delà du nom : la note qu'on vient de toucher. */
  const [charge, setCharge] = React.useState(null);
  const [solde, setSolde] = React.useState(4);
  const [produits, setProduits] = React.useState({ message: true });
  const [toast, setToast] = React.useState(null);

  React.useEffect(() => { document.body.classList.toggle("lehno-nuit", nuit); }, [nuit]);

  const t = {
    ...COPY[langue], nuit,
    decompte: notation === "phrase" ? COPY[langue].decomptePhrase : COPY[langue].decompteBarre
  };
  const ecran = ECRANS.find((e) => e.id === ecranId) || ECRANS[4];

  /* Changer d'écran remet l'état sur celui que le nouvel écran sait jouer :
     un « hors connexion » n'a pas de sens sur la connexion. */
  const pile = React.useRef([]);
  const empiler = () => pile.current.push({ id: ecranId, etat, sujet, charge });

  const flags = PROFILS[profil] || PROFILS.tout;
  const eteints = ETEINTS[profil] || [];

  const aller = (id) => {
    const suivant = ECRANS.find((e) => e.id === id);
    if (!suivant) return;
    if (suivant.onglet) pile.current = [];
    else if (id !== ecranId) empiler();
    setEcranId(id);
    const ouverts = etatsOuverts(suivant, flags);
    if (ouverts.indexOf(etat) < 0) setEtat(ouverts[0]);
  };

  /* Le retour rend l'écran d'où l'on vient, avec son sujet et son état — sans
     pile, il ramenait tout le monde à l'accueil. */
  const retour = () => {
    const p = pile.current.pop();
    if (!p) { setEcranId("accueil"); setEtat("nominal"); return; }
    setEcranId(p.id); setEtat(p.etat); setSujet(p.sujet); setCharge(p.charge);
  };

  /* Le palier se crédite une fois, quand le paiement aboutit — pas à chaque
     passage sur l'écran d'issue. */
  const credite = React.useRef(false);
  React.useEffect(() => {
    const abouti = ecranId === "recharge" && etat === "abouti";
    if (abouti && !credite.current) { credite.current = true; setSolde((v) => v + 12); }
    if (!abouti) credite.current = false;
  }, [ecranId, etat]);

  const props = { t, etat, flags, qui: sujet || undefined, note: charge && charge.note,
    depuis: charge && charge.jour ? charge : undefined,
    quand: charge && charge.date ? charge : undefined,
    onSupprimer: () => { setCharge(null); aller("proche"); },
    onOpen: (id, personne) => {
      setSujet(personne && personne.nom ? personne.nom : null);
      setCharge(personne || null);
      aller(id);
      if (personne && personne.etat) {
        const cible = ECRANS.find((e) => e.id === id);
        if (cible && cible.etats.indexOf(personne.etat) >= 0) setEtat(personne.etat);
      }
    },
    onSuite: () => aller(ecran.id === "splash" ? "connexion"
    : ecran.id === "connexion" ? "code"
    : ecran.id === "code" ? (etat === "connu" ? "accueil" : "pseudo")
    : ecran.id === "pseudo" ? "bienvenue" : "accueil"),
    /* Une date enregistrée se retrouve là où on va la chercher : le calendrier.
       Les autres formulaires reviennent à l'accueil. */
    onRetour: retour,
    onEnregistrer: () => aller(ecran.id === "evenement" ? "dates" : "accueil"),
    onRetirer: (reserve, fait) => setRetrait({ reserve, fait }),
    onInviter: () => aller("parrainage"),
    onRecherche: () => aller("recherche"), base: "../../", solde,
    mouvements: MOUVEMENTS[langue],
    onLangue: (k) => setLangue(k),

    /* Le chemin payant : rien ne se lance sans que le coût soit annoncé — et
       quand il n'y a plus de coût, la feuille de confirmation n'a plus rien à
       annoncer : le geste part directement. */
    onLancer: (quoi) => {
      if (flags.credits === false) {
        empiler();
        setEcranId("generation");
        setEtat(quoi === "idees" ? "idees" : "message");
        return;
      }
      setFeuille(quoi);
    },
    /* Un portrait est une image : il a son propre écran. */
    onVoir: (quoi) => {
      empiler();
      if (quoi === "portrait") { setEcranId("portrait"); setEtat("nominal"); return; }
      setEcranId("generation"); setEtat(quoi === "idees" ? "idees" : "message");
    },
    /* Le crédit se paie à la génération, jamais au partage : le texte est déjà
       produit et payé. « Envoyer » passe la main au sélecteur du système. */
    onEnvoyer: () => { setToast(t.resEnvoyerVia); setTimeout(() => setToast(null), 2400); },
    onCopier: () => { setToast(t.resCopie); setTimeout(() => setToast(null), 2200); },
    onFait: (m) => { setToast(m); setTimeout(() => setToast(null), 2600); },
    onPayer: () => { empiler(); setEcranId("recharge"); setEtat("attente"); } };

  const NOMS = { portrait: t.prepPortraitTitre, idees: t.prepIdeesTitre, message: t.prepMessageTitre };
  const RESULTATS = { portrait: t.prepPortraitTexte, idees: t.prepIdeesTexte, message: t.prepMessageTexte };

  /* Lancer : on prélève, on montre l'attente, puis le résultat arrive. C'est la
     seule séquence temporisée du prototype — l'attente est le moment que la
     spec demande de soigner, elle ne peut pas être sautée. */
  const confirmer = () => {
    const quoi = feuille;
    setFeuille(null);
    setSolde((v) => Math.max(0, v - 1));
    empiler();
    setEcranId("generation");
    setEtat("attente");
    setTimeout(() => {
      setProduits((v) => ({ ...v, [quoi]: true }));
      if (quoi === "portrait") { setEcranId("portrait"); setEtat("avalider"); return; }
      setEtat(quoi === "idees" ? "idees" : "message");
    }, 2200);
  };

  let vue;
  switch (ecran.id) {
    case "splash": vue = <SplashScreen {...props} />; break;
    case "connexion": vue = <ConnexionScreen {...props} />; break;
    case "code": vue = <CodeScreen {...props} />; break;
    case "pseudo": vue = <PseudoScreen {...props} />; break;
    case "bienvenue": vue = <BienvenueScreen {...props} />; break;
    case "proches": vue = <ProchesScreen {...props}
      gens={etat === "carnet" ? PROCHES_LONG : PROCHES}
      etat={etat === "carnet" ? "nominal" : etat} />; break;
    case "proche": vue = <ProcheScreen {...props}
      personne={charge && charge.nom ? charge : undefined} />; break;
    case "note": vue = <NoteScreen {...props} gens={PROCHES} />; break;
    case "evenement": vue = <EvenementScreen {...props} gens={PROCHES} />; break;
    case "maintenance": vue = <MaintenanceScreen {...props} onReessayer={() => aller("accueil")} />; break;
    case "recherche": vue = <RechercheScreen {...props} gens={PROCHES} />; break;
    case "souhait": vue = <SouhaitScreen {...props}
      key={(charge && charge.nouveau ? "nouveau" : "fiche")
        + (charge && charge.mien === false ? "-pour" : "")}
      mien={!(charge && charge.mien === false)}
      nouveau={!!(charge && charge.nouveau)}
      souhait={charge && charge.quoi ? charge : undefined} />; break;
    case "occasion": vue = <OccasionScreen {...props}
      souhaits={SOUHAITS_PROCHE[langue]} />; break;
    case "dates": vue = <DatesScreen {...props} />; break;
    case "preparation": vue = <PreparationScreen {...props} faits={produits} />; break;
    case "generation": vue = <GenerationScreen {...props} />; break;
    case "notifications": vue = <NotificationsScreen {...props} />; break;
    case "valider": vue = <AValiderScreen {...props} />; break;
    case "reprises": vue = <ReprisesScreen {...props} />; break;
    case "collecte": vue = <CollecteScreen {...props} />; break;
    case "identite": vue = <IdentiteScreen {...props}
      key={charge && charge.nouveau ? "nouveau" : "fiche"}
      nouveau={!!(charge && charge.nouveau)} />; break;
    case "portrait": vue = <PortraitScreen {...props} />; break;
    case "studio": vue = <StudioScreen {...props} />; break;
    case "surface": {
      const mienne = sujet === "Valentine";
      const maListe = mienne
        ? (MES_LISTES[langue].find((x) => x.id === (charge && charge.listeId))
           || MES_LISTES[langue][0])
        : null;
      const leProche = mienne ? null : PROCHES.find((p) => p.nom === sujet);
      vue = <SurfacePubliqueScreen {...props} mien={mienne}
        souhaits={mienne ? maListe.souhaits : SOUHAITS_PROCHE[langue]}
        listeQuand={mienne ? maListe.quand
          : (leProche ? (langue === "fr" ? leProche.date : (leProche.dateEn || leProche.date))
             : undefined)} />;
      break;
    }
    case "cadrage": vue = <CadrageIdeesScreen {...props} />; break;
    case "recharge": vue = <RechargeScreen {...props} />; break;
    case "parrainage": vue = <ParrainageScreen {...props} />; break;
    case "listes": vue = <ListesScreen {...props}
      souhaits={SOUHAITS_PROCHE[langue]} listes={MES_LISTES[langue]}
      mesDates={MES_DATES[langue]} />; break;
    case "monmur": vue = <MonMurScreen {...props}
      onglet={charge && charge.onglet ? charge.onglet : "page"} />; break;
    case "profil": vue = <ProfilScreen {...props} />; break;
    case "rappels": vue = <RappelsScreen {...props} />; break;
    case "reglagesHub": vue = <ReglagesHubScreen {...props} />; break;
    case "securite": vue = <SecuriteScreen {...props} />; break;
    case "paiement": vue = <PaiementScreen {...props} />; break;
    case "donnees": vue = <DonneesScreen {...props}
      onFerme={() => aller("compteferme")} />; break;
    case "compteferme": vue = <CompteFermeScreen {...props}
      onSuite={() => aller("connexion")} />; break;
    case "aide": vue = <AideScreen {...props} />; break;
    case "reservations": vue = <ReservationsScreen {...props} />; break;
    case "moi": vue = <MoiScreen {...props} />; break;
    default: vue = <AccueilScreen {...props}
      echeances={flags.eventsOther === false
        ? PROCHES.filter((p) => p.type === "anniversaire") : PROCHES} />;
  }

  const chrome = ecran.chrome !== false;
  let titre = typeof ecran.titre === "string" ? ecran.titre
    : ecran.titre ? ecran.titre[langue] : undefined;
  /* Une note existante ne s'ouvre pas sous « Nouvelle note ». */
  if (ecran.id === "note" && charge && charge.note) titre = t.noteTitreModifier;
  /* La fiche écrit le nom en grand : la barre n'a pas à le redire. */
  if (ecran.id === "proche") titre = undefined;
  if (ecran.id === "surface") titre = etat === "collecte" ? "Valentine" : (sujet || "Célarine");
  /* La wishlist d'un proche écrit son nom en grand : la barre reste nue. */
  if (ecran.id === "listes" && sujet) titre = undefined;
  if (ecran.id === "souhait" && charge && charge.nouveau) titre = t.souhaitAjouterTitre;
  if (ecran.id === "evenement" && flags.eventsOther === false) titre = t.evtTitreAnniv;
  /* Une identité créée de zéro ne porte pas encore de nom. */
  if (ecran.id === "identite") titre = charge && charge.nouveau ? t.ajouterProche : (sujet || "Valery Bah");
  /* Une occasion porte la date qu'on a touchée, pas celle du gabarit. */
  if (ecran.id === "occasion" && charge && charge.date) {
    titre = langue === "fr" ? charge.date : (charge.dateEn || charge.date);
  }

  const Bascule = ({ label, valeur, options, onSet }) => (
    <div style={{ marginBottom: 14 }}>
      <div className="lbl" style={{ marginBottom: 6 }}>{label}</div>
      <div className="swap" role="group" aria-label={label}>
        {options.map(([k, l]) => (
          <button key={k} type="button" aria-pressed={valeur === k} onClick={() => onSet(k)}>{l}</button>
        ))}
      </div>
    </div>
  );

  return (
    <div className="stage">
      <div className="side">
        <div className="lbl">Prototype</div>
        <h1 className="lehno-display" style={{
          fontSize: 25, letterSpacing: "-.025em", margin: "8px 0 16px", fontWeight: 500
        }}>L'application</h1>

        <Bascule label="Thème" valeur={nuit ? "n" : "c"}
          options={[["c", "Clair"], ["n", "Sombre"]]} onSet={(k) => setNuit(k === "n")} />
        <Bascule label="Langue" valeur={langue}
          options={[["fr", "FR"], ["en", "EN"]]} onSet={setLangue} />
        <Bascule label="Modèle" valeur={modele}
          options={[["se", "SE"], ["standard", "Courant"], ["max", "Grand"]]} onSet={setModele} />
        <Bascule label="Système" valeur={os}
          options={[["ios", "iOS"], ["android", "Android"]]} onSet={setOs} />
        <Bascule label="Décompte" valeur={notation}
          options={[["barre", "J−3"], ["phrase", "dans 3 jours"]]} onSet={setNotation} />
        {/* Le profil de lancement n'est pas une variante : c'est le point de
            départ. Un drapeau naît éteint. */}
        <Bascule label="Drapeaux" valeur={profil}
          options={[["tout", "Tout allumé"], ["lancement", "Lancement"], ["gratuit", "Crédits éteints"]]}
          onSet={(k) => {
            setProfil(k);
            const perdus = ETEINTS[k] || [];
            if (perdus.indexOf(ecranId) >= 0) { setSujet(null); setCharge(null); aller("accueil"); return; }
            const ouverts = etatsOuverts(ecran, PROFILS[k] || PROFILS.tout);
            if (ouverts.indexOf(etat) < 0) setEtat(ouverts[0]);
          }} />

        <div className="lbl" style={{ marginTop: 20 }}>Solde</div>
        <div className="lehno-display" style={{ fontSize: 21, marginTop: 4 }}>
          {solde} <span style={{ fontFamily: "var(--font-body)", fontSize: 13, color: "var(--text-secondary)" }}>
            {solde === 1 ? "crédit" : "crédits"}
          </span>
        </div>
        <button type="button" onClick={() => setSolde(4)} className="lehno-focusable" style={{
          all: "unset", cursor: "pointer", fontFamily: "var(--font-body)", fontSize: 12,
          color: "var(--text-accent)", marginTop: 4
        }}>Remettre à 4</button>

        <div className="lbl" style={{ marginTop: 20 }}>Écrans</div>
        <div className="rail">
          {ECRANS.filter((e) => eteints.indexOf(e.id) < 0).map((e) => (
            <button key={e.id} type="button" aria-current={e.id === ecranId}
              onClick={() => { setSujet(null); setCharge(null); aller(e.id); }}>
              <span className="num">{e.num}</span>{e.nom[langue]}
            </button>
          ))}
        </div>
      </div>

      <PhoneFrame os={os} modele={modele} pleinEcran={ecran.id === "splash"}
        etiquette={ecran.num + " · " + nomEtat(ecran.id, etat, langue)}
        onVoile={() => { setFeuille(null); setRetrait(null); }}
        feuille={feuille ? (
          <PaidActionSheet t={t} titre={NOMS[feuille]} resultat={RESULTATS[feuille]}
            cout={1} solde={solde}
            onConfirmer={confirmer}
            onRecharger={() => { setFeuille(null); aller("moi"); }}
            onAnnuler={() => setFeuille(null)} />
        ) : retrait ? (
          <ConfirmSheet destructif
            titre={t.souhaitRetraitTitre}
            texte={retrait.reserve ? t.souhaitRetraitReserve : t.souhaitRetraitTexte}
            confirmer={t.souhaitRetraitConfirmer} annuler={t.souhaitRetraitGarder}
            onConfirmer={() => { const f = retrait.fait; setRetrait(null); f(); }}
            onAnnuler={() => setRetrait(null)} />
        ) : null}>
        {chrome ? (
          <AppHeader t={t} dark={nuit} base="../../"
            notifications={ecran.onglet ? 2 : 0}
            onCloche={() => aller("notifications")}
            onBack={ecran.onglet ? undefined : retour}
            title={titre} />
        ) : null}
        <div style={{
          position: "relative", flex: 1, minHeight: 0, overflowY: "auto",
          display: "flex", flexDirection: "column"
        }}>
          {vue}

          {toast ? (
            <div style={{
              position: "absolute", left: 14, right: 14, bottom: 16, zIndex: 10,
              background: "var(--feedback-success-bg)", color: "var(--feedback-success)",
              borderRadius: "var(--radius-lg)", padding: "13px 15px",
              fontFamily: "var(--font-body)", fontSize: 13.5, lineHeight: 1.4
            }}>{toast}</div>
          ) : null}
        </div>
        {ecran.onglet ? (
          <div style={{ flex: "none", paddingBottom: MODELES[modele].safeBas ? 14 : 4 }}>
            <TabBar active={ecran.onglet} onSelect={aller}
              tabs={[
                { id: "accueil", label: t.ongletAccueil, icon: "house" },
                { id: "dates", label: t.ongletDates, icon: "calendar" },
                { id: "proches", label: t.ongletProches, icon: "heart" },
                flags.moi === false ? null : { id: "moi", label: t.ongletMoi, icon: "user" },
                { id: "reglagesHub", label: t.ongletReglages, icon: "settings" }
              ].filter(Boolean)} />
          </div>
        ) : null}
      </PhoneFrame>

      <div className="side">
        <div className="lbl">États de cet écran</div>
        <div className="rail">
          {etatsOuverts(ecran, flags).map((k) => (
            <button key={k} type="button" aria-current={k === etat} onClick={() => setEtat(k)}>
              {nomEtat(ecran.id, k, langue)}
            </button>
          ))}
        </div>
        <p style={{ fontSize: 11.5, color: "var(--text-mention)", lineHeight: 1.5, marginTop: 18 }}>
          Le rail ne propose que les états que cet écran sait jouer. Passez en <strong>SE</strong>
          et en <strong>EN</strong> ensemble : c'est la combinaison qui révèle les libellés trop longs.
        </p>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
