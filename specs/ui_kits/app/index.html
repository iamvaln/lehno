const CHROME_ABSENT = ["splash", "connexion", "code", "pseudo", "bienvenue", "recherche", "notifications"];

function Ecran({ def, etat, langue, nuit, modele, os, legende }) {
  const t = { ...COPY[langue], nuit };
  const props = { t, etat, base: "../../", onOpen: () => {}, onSuite: () => {},
                  onRetour: () => {}, onEnregistrer: () => {}, onRecherche: () => {},
                  onInviter: () => {} };

  let vue;
  switch (def.id) {
    case "splash":    vue = <SplashScreen {...props} />; break;
    case "connexion": vue = <ConnexionScreen {...props} />; break;
    case "code":      vue = <CodeScreen {...props} />; break;
    case "pseudo":    vue = <PseudoScreen {...props} />; break;
    case "bienvenue": vue = <BienvenueScreen {...props} />; break;
    case "proches":   vue = <ProchesScreen {...props} gens={PROCHES} />; break;
    case "proche":    vue = <ProcheScreen {...props} />; break;
    case "note":      vue = <NoteScreen {...props} />; break;
    case "evenement": vue = <EvenementScreen {...props} />; break;
    case "recherche": vue = <RechercheScreen {...props} gens={PROCHES} />; break;
    case "souhait":   vue = <SouhaitScreen {...props} />; break;
    case "occasion":  vue = <OccasionScreen {...props} />; break;
    case "dates":     vue = <DatesScreen {...props} />; break;
    case "preparation":   vue = <PreparationScreen {...props} />; break;
    case "generation":    vue = <GenerationScreen {...props} />; break;
    case "notifications": vue = <NotificationsScreen {...props} />; break;
    case "valider":       vue = <AValiderScreen {...props} />; break;
    case "reprises":      vue = <ReprisesScreen {...props} />; break;
    case "collecte":      vue = <CollecteScreen {...props} />; break;
    case "identite":      vue = <IdentiteScreen {...props} />; break;
    case "portrait":      vue = <PortraitScreen {...props} />; break;
    case "studio":   vue = <StudioScreen {...props} />; break;
    case "surface":       vue = <SurfacePubliqueScreen {...props} />; break;
    case "cadrage":       vue = <CadrageIdeesScreen {...props} />; break;
    case "moi":           vue = <MoiScreen {...props} />; break;
    case "recharge":      vue = <RechargeScreen {...props} />; break;
    case "parrainage":    vue = <ParrainageScreen {...props} />; break;
    case "monmur":        vue = <MonMurScreen {...props} />; break;
    case "profil":        vue = <ProfilScreen {...props} />; break;
    case "reglages":      vue = <ReglagesScreen {...props} />; break;
    case "securite":      vue = <SecuriteScreen {...props} />; break;
    case "paiement":      vue = <PaiementScreen {...props} />; break;
    case "aide":          vue = <AideScreen {...props} />; break;
    case "reservations":  vue = <ReservationsScreen {...props} />; break;
    default:          vue = <AccueilScreen {...props} echeances={PROCHES} />;
  }

  const chrome = CHROME_ABSENT.indexOf(def.id) < 0;
  const titre = typeof def.titre === "string" ? def.titre : def.titre ? def.titre[langue] : undefined;
  const nom = legende ? legende[langue] : def.nom[langue];

  return (
    <PhoneFrame os={os} modele={modele} auto pleinEcran={def.id === "splash"}
      etiquette={def.num + " · " + nom}>
      {chrome ? (
        <AppHeader dark={nuit} base="../../" notifications={def.id === "accueil" ? 2 : 0}
          onBack={titre ? () => {} : undefined} title={titre} />
      ) : null}
      {/* Pas d'« overflow: hidden » : le châssis est en « auto », donc il s'allonge
          et l'écran se montre en entier — c'est le rôle de la planche. Et flex
          column, sinon un écran qui veut occuper toute la hauteur ne peut pas
          s'étirer : un « flex: 1 » sans conteneur flexible ne fait rien. */}
      <div style={{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column" }}>{vue}</div>
      {def.onglet ? (
        <div style={{ flex: "none", paddingBottom: MODELES[modele].safeBas ? 14 : 4 }}>
          <TabBar active={def.onglet} tabs={[
            { id: "accueil", label: COPY[langue].ongletAccueil, icon: "house" },
            { id: "dates",   label: COPY[langue].ongletDates,   icon: "calendar" },
            { id: "proches", label: COPY[langue].ongletProches, icon: "heart" },
            { id: "moi",     label: COPY[langue].ongletMoi,     icon: "user" }
          ]} />
        </div>
      ) : null}
    </PhoneFrame>
  );
}

function Bascule({ label, valeur, options, onSet }) {
  return (
    <div>
      <div className="lbl" style={{ marginBottom: 6 }}>{label}</div>
      <div className="swap" role="group" aria-label={label}>
        {options.map(([k, l]) => (
          <button key={k} type="button" aria-pressed={valeur === k} onClick={() => onSet(k)}>{l}</button>
        ))}
      </div>
    </div>
  );
}

function Planche() {
  const [nuit, setNuit] = React.useState(false);
  const [langue, setLangue] = React.useState("fr");
  const [modele, setModele] = React.useState("standard");
  const [os, setOs] = React.useState("ios");

  React.useEffect(() => {
    document.body.classList.toggle("lehno-nuit", nuit);
    document.documentElement.lang = langue;
  }, [nuit, langue]);

  const commun = { langue, nuit, modele, os };

  /* Les légendes se répètent (« tout est traité » sur deux écrans) : on les
     dédoublonne pour la phrase, et c'est CE nombre qu'on annonce — sinon le
     compte promis et la liste lisible se contredisent. Pas de mise en
     minuscules : elle mangerait la capitale de Lehno. */
  const legendes = [...new Set(ETATS.map((e) => e.legende.fr))];

  return (
    <>
      <div className="bar">
        <div>
          <div className="lbl" style={{ marginBottom: 4 }}>Planche de revue</div>
          <div className="lehno-display" style={{ fontSize: 19 }}>
            La phase 1 — le carnet
          </div>
        </div>
        <div style={{ display: "flex", gap: 18, flexWrap: "wrap", marginLeft: "auto" }}>
          <Bascule label="Thème" valeur={nuit ? "n" : "c"}
            options={[["c", "Clair"], ["n", "Sombre"]]} onSet={(k) => setNuit(k === "n")} />
          <Bascule label="Langue" valeur={langue}
            options={[["fr", "FR"], ["en", "EN"]]} onSet={setLangue} />
          <Bascule label="Modèle" valeur={modele}
            options={[["se", "SE"], ["standard", "Courant"], ["max", "Grand"]]} onSet={setModele} />
          <Bascule label="Système" valeur={os}
            options={[["ios", "iOS"], ["android", "Android"]]} onSet={setOs} />
        </div>
      </div>

      <section>
        <h2>Les écrans, avec leurs données</h2>
        <p className="note">
          {SUITE.length} écrans dans l'ordre de la spec — de « {SUITE[0].nom.fr} » à
          « {SUITE[SUITE.length - 1].nom.fr} ». C'est l'état nominal : celui qu'on voit tous
          les jours. Les châssis s'allongent jusqu'à leur contenu — rien n'est coupé, et en
          « SE » on voit d'un coup quels écrans débordent d'un vrai téléphone.
        </p>
        <div className="rangee">
          {SUITE.map((d) => <Ecran key={d.id} def={d} etat="nominal" {...commun} />)}
        </div>
      </section>

      <section>
        <h2>Les états particuliers</h2>
        <p className="note">
          Chacun est un écran à part entière, pas une variante à deviner. Les textes annoncent
          ce qui est possible, jamais ce qui manque — la spec l'impose et le calme est une
          réponse. {ETATS.length} vues, pour {legendes.length} situations :{" "}
          {legendes.join(" · ")}.
        </p>
        <div className="rangee">
          {ETATS.map((e, i) => (
            <Ecran key={e.id + e.etat + i}
              def={{ ...(SUITE.find((s) => s.id === e.id) || {}), num: e.num }}
              etat={e.etat} legende={e.legende} {...commun} />
          ))}
        </div>
      </section>

      <section style={{ marginBottom: 0 }}>
        <h2>Ce que la planche ne montre pas</h2>
        <p className="note">
          Les parcours. Un écran juste peut s'enchaîner mal : le prototype cliquable
          (<a href="prototype.html">prototype.html</a>) traverse les quatre parcours de la
          spec §4. Les vingt-sept écrans de la spec mobile sont dessinés ; reste le
          back-office, qui attend son arbitrage d'identité — un outil qu'on regarde huit
          heures par jour n'a pas les besoins d'un carnet intime.
        </p>
      </section>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Planche />);
</script>
</body>
</html>
