  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"ce4aafcd-1118-4d94-8aa6-04c2048e1bfc\"><\u002Fscript>\n<style>\n  body { margin: 0; background: #FFFFFF; }\n  a { color: #5A4B93; text-decoration: none; border-bottom: 1px solid #E2DDF0; }\n  a:hover { color: #221F2B; border-bottom-color: #221F2B; }\n  .fr { font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 40, 'WONK' 1; }\n  @keyframes lehno-ecrire { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n  @keyframes lehno-teinte { 0%, 40% { fill: #221F2B; } 100% { fill: #7B6BB7; } }\n  @keyframes lehno-tuile { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }\n  @media (prefers-reduced-motion: reduce) { svg path, svg rect { animation: none !important; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#FFFFFF;color:#221F2B;font-family:Karla,system-ui,sans-serif;font-size:15px;line-height:1.6;padding:64px 56px 96px;max-width:1180px;margin:0 auto\">\n\n  <header style=\"border-bottom:2px solid #221F2B;padding-bottom:28px;margin-bottom:26px\">\n    <div style=\"display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap\">\n      <div>\n        <div style=\"font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9C97A8\">Lehno — lehno.app · identité visuelle, version arrêtée<\u002Fdiv>\n        <h1 class=\"fr\" style=\"font-weight:500;font-size:50px;letter-spacing:-.03em;line-height:1.05;margin:14px 0 0;max-width:20ch\">Intime, chaleureux, élégant, sobre<\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"margin-left:auto;max-width:38ch\">\n        <p style=\"color:#6B6579;margin:0\">Le corps de l'application reste blanc. Le violet habille ce qui agit. La chaleur vient du caractère typographique, pas de la couleur.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"background:#EDEAF7;padding:20px 24px;margin-bottom:64px;display:flex;gap:20px;align-items:baseline;flex-wrap:wrap\">\n    <span style=\"font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5A4B93\">Arbitrage<\u002Fspan>\n    <p style=\"margin:0;color:#221F2B;max-width:80ch\">Le signe retenu est le <span class=\"fr\" style=\"color:#5A4B93;font-size:17px\">h<\u002Fspan> seul — la lettre déjà mise en valeur dans le mot. Le monogramme LHO est écarté : le produit multiplie les surfaces où la marque apparaît petite et sans son nom, et c'est là que la même lettre, vue partout, se retient le plus vite.<\u002Fp>\n  <\u002Fdiv>\n\n  <section style=\"margin:0 0 76px\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #221F2B;padding-bottom:10px;margin-bottom:32px\">\n      <span style=\"font-weight:600;font-size:11px;letter-spacing:.14em;color:#9C97A8\">01<\u002Fspan>\n      <h2 class=\"fr\" style=\"font-weight:500;font-size:30px;letter-spacing:-.02em;margin:0\">Le logotype<\u002Fh2>\n      <span style=\"margin-left:auto;font-size:13px;color:#6B6579\">couleur · inversé · une seule encre<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;gap:2px;background:#EDEBF2;border:1px solid #EDEBF2\">\n      <div style=\"background:#FFFFFF;padding:52px 40px\">\n        <img src=\"08524325-029d-4748-ac16-2e76d4646b2b\" alt=\"Lehno\" style=\"display:block;width:420px;max-width:100%\">\n        <div style=\"display:flex;gap:20px;align-items:baseline;margin-top:20px;flex-wrap:wrap\">\n          <span style=\"font-size:12px;letter-spacing:.12em;color:#9C97A8\">LÈH·NOH<\u002Fspan>\n          <span class=\"fr\" style=\"font-style:italic;font-size:17px;color:#6B6579\">Version courante — sur papier blanc.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#221F2B;padding:52px 40px\">\n        <img src=\"600075e9-9db3-4d09-8cdb-933454234dba\" alt=\"Lehno\" style=\"display:block;width:420px;max-width:100%\">\n        <div style=\"display:flex;gap:20px;align-items:baseline;margin-top:20px;flex-wrap:wrap\">\n          <span style=\"font-size:12px;letter-spacing:.12em;color:#9C97A8\">LÈH·NOH<\u002Fspan>\n          <span class=\"fr\" style=\"font-style:italic;font-size:17px;color:#EDEAF7\">Sur encre — le h passe à l'abricot, le violet perdant en lisibilité.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;padding:52px 40px\">\n        <img src=\"ebc4a3fb-b23f-4f2d-9f0e-724ab95b536d\" alt=\"Lehno\" style=\"display:block;width:420px;max-width:100%\">\n        <div style=\"display:flex;gap:20px;align-items:baseline;margin-top:20px;flex-wrap:wrap\">\n          <span style=\"font-size:12px;letter-spacing:.12em;color:#9C97A8\">LÈH·NOH<\u002Fspan>\n          <span class=\"fr\" style=\"font-style:italic;font-size:17px;color:#6B6579\">Une seule encre — gravure, tampon, télécopie.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:26px\">\n      <p style=\"color:#6B6579;margin:0\"><strong style=\"color:#221F2B;font-weight:700\">Pourquoi le h.<\u002Fstrong> Il est muet, et c'est pourtant lui qui sépare Lehno de « Leno ». Le teinter en fait la lettre qu'on remarque, et la marque enseigne sa propre prononciation. La mention <em>lèh·noh<\u002Fem> accompagne le mot partout où le nom se découvre : magasins d'applications, landing, pied des portraits partagés.<\u002Fp>\n      <p style=\"color:#6B6579;margin:0\"><strong style=\"color:#221F2B;font-weight:700\">Le tracé.<\u002Fstrong> Fraunces à l'instance exacte — graisse 500, SOFT 40, WONK 1, taille optique 144 — vectorisée en courbes. Reste la reprise à la main : hampe du <span class=\"fr\">h<\u002Fspan> allongée de 4 %, épaule resserrée, jonctions adoucies, interlettrage <span class=\"fr\">e<\u002Fspan>/<span class=\"fr\">h<\u002Fspan> repris pour que la couleur ne creuse pas de trou dans le mot.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin:0 0 76px\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #221F2B;padding-bottom:10px;margin-bottom:32px\">\n      <span style=\"font-weight:600;font-size:11px;letter-spacing:.14em;color:#9C97A8\">02<\u002Fspan>\n      <h2 class=\"fr\" style=\"font-weight:500;font-size:30px;letter-spacing:-.02em;margin:0\">Le signe<\u002Fh2>\n      <span style=\"margin-left:auto;font-size:13px;color:#6B6579\">la même lettre, partout<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:300px 1fr;gap:44px;align-items:start\">\n      <div>\n        <div style=\"position:relative;width:300px;height:300px\">\n          <img src=\"202cc515-0b00-4f79-8161-1a5971a41fc2\" alt=\"Icône Lehno\" style=\"display:block;width:300px;height:300px\">\n          <sc-if value=\"{{ showConstruction }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.30) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.30) 1px,transparent 1px);background-size:10% 10%;pointer-events:none\"><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9C97A8;margin-top:12px\">Icône · 512 px · carré<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin:0 0 26px;color:#6B6579;max-width:56ch\">Sortie du mot, la lettre doit porter assez de caractère pour se retenir seule : l'empattement est conservé au pied, l'épaule reste tendue, et le <span class=\"fr\">h<\u002Fspan> est centré sur son encre — non sur sa boîte typographique, qui l'aurait fait pencher à droite.<\u002Fp>\n        <div style=\"display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap\">\n          <div>\n            <img src=\"d4818f5f-fcff-481b-b53c-3227f1e24ccc\" alt=\"\" style=\"display:block;width:124px;height:124px\">\n            <div style=\"font-size:11px;color:#9C97A8;margin-top:8px\">rond · avatar<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <img src=\"14b357f4-0e1d-4cfc-bfd5-944c72bc89c5\" alt=\"\" style=\"display:block;width:124px;height:124px\">\n            <div style=\"font-size:11px;color:#9C97A8;margin-top:8px\">claire · lilas<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <img src=\"7cba9e65-2a88-4fb2-a60f-60a4705cc165\" alt=\"\" style=\"display:block;width:124px;height:124px\">\n            <div style=\"font-size:11px;color:#9C97A8;margin-top:8px\">sombre · encre<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #E2DDF0\">\n            <img src=\"e3db7514-4f1c-4c61-83e6-f43136c31791\" alt=\"\" style=\"display:block;width:122px;height:122px\">\n            <div style=\"font-size:11px;color:#9C97A8;margin:8px 0 0 1px\">une encre<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border-top:1px solid #EDEBF2;margin-top:38px;padding-top:26px\">\n      <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-bottom:20px\">Paliers — chacun redessiné, jamais réduit<\u002Fdiv>\n      <div style=\"display:flex;gap:34px;align-items:flex-end;flex-wrap:wrap\">\n        <div>\n          <img src=\"ad4c1af6-1189-46ac-8d08-19487ebb0002\" alt=\"\" width=\"128\" height=\"128\" style=\"display:block\">\n          <div style=\"font-size:11px;color:#9C97A8;margin-top:8px\">128 · opsz 72<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <img src=\"7f21ecb9-39a5-440e-8e54-8bfd962fa7bc\" alt=\"\" width=\"64\" height=\"64\" style=\"display:block\">\n          <div style=\"font-size:11px;color:#9C97A8;margin-top:8px\">64 · graisse 600<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <img src=\"0cbd6102-1e15-4644-80f0-c610ca7087de\" alt=\"\" width=\"40\" height=\"40\" style=\"display:block\">\n          <div style=\"font-size:11px;color:#9C97A8;margin-top:8px\">40 · graisse 650<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <img src=\"800f2bed-9ec2-4296-939f-87f8c79b41ae\" alt=\"\" width=\"28\" height=\"28\" style=\"display:block\">\n          <div style=\"font-size:11px;color:#9C97A8;margin-top:8px\">28 · graisse 700<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 6px;color:#6B6579;font-size:13.5px;max-width:40ch\">À mesure que la taille tombe, le trait s'épaissit et la taille optique descend : les empattements s'émoussent, le contrepoinçon s'ouvre. À 28 px il reste une hampe et une arche — ce qui suffit.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin:0 0 76px\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #221F2B;padding-bottom:10px;margin-bottom:32px\">\n      <span style=\"font-weight:600;font-size:11px;letter-spacing:.14em;color:#9C97A8\">03<\u002Fspan>\n      <h2 class=\"fr\" style=\"font-weight:500;font-size:30px;letter-spacing:-.02em;margin:0\">Signe et mot ensemble<\u002Fh2>\n      <span style=\"margin-left:auto;font-size:13px;color:#6B6579\">horizontal · empilé<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.5fr 1fr;gap:2px;background:#EDEBF2;border:1px solid #EDEBF2\">\n      <div style=\"background:#FFFFFF;padding:44px 40px\">\n        <img src=\"5767b0cf-ea73-4d96-b154-e1246601458c\" alt=\"Lehno\" style=\"display:block;width:420px;max-width:100%\">\n        <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9C97A8;margin-top:24px\">Horizontal — navigation, en-tête d'e-mail, pied de portrait<\u002Fdiv>\n        <p style=\"margin:10px 0 0;font-size:13.5px;color:#6B6579;max-width:52ch\">L'écart signe / mot vaut un quart de la pastille. Le mot est centré sur la hauteur de la pastille, calé sur sa hauteur de capitale.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;padding:44px 40px\">\n        <img src=\"3b31f256-dbc2-4650-9bf5-5da403ca79fe\" alt=\"Lehno\" style=\"display:block;width:190px;max-width:100%\">\n        <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9C97A8;margin-top:24px\">Empilé — écran de lancement, magasin, format carré<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin:0 0 76px\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #221F2B;padding-bottom:10px;margin-bottom:32px\">\n      <span style=\"font-weight:600;font-size:11px;letter-spacing:.14em;color:#9C97A8\">04<\u002Fspan>\n      <h2 class=\"fr\" style=\"font-weight:500;font-size:30px;letter-spacing:-.02em;margin:0\">Protection, tailles, proscrits<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:340px 1fr;gap:48px;align-items:start\">\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-bottom:16px\">Zone de protection<\u002Fdiv>\n        <div style=\"position:relative;padding:42px;border:1px dashed #9C97A8;display:inline-block\">\n          <img src=\"202cc515-0b00-4f79-8161-1a5971a41fc2\" alt=\"\" style=\"display:block;width:150px;height:150px\">\n        <\u002Fdiv>\n        <p style=\"margin:14px 0 0;font-size:13.5px;color:#6B6579;max-width:40ch\">Aucun élément — texte, filet, bord de photographie — n'entre dans cette marge, égale à la largeur de la hampe du signe. Les magasins recadrant l'icône, la même marge est ménagée à l'intérieur du carré, et le rendu est vérifié en masque circulaire.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:28px\">\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-bottom:10px\">Tailles minimales<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:0 28px;font-size:14px;color:#6B6579\">\n            <div style=\"border-top:1px solid #EDEBF2;padding:9px 0\">Signe seul, écran — <strong style=\"color:#221F2B\">28 px<\u002Fstrong><\u002Fdiv>\n            <div style=\"border-top:1px solid #EDEBF2;padding:9px 0\">Signe seul, impression — <strong style=\"color:#221F2B\">8 mm<\u002Fstrong><\u002Fdiv>\n            <div style=\"border-top:1px solid #EDEBF2;padding:9px 0\">Verrouillage horizontal — <strong style=\"color:#221F2B\">120 px<\u002Fstrong><\u002Fdiv>\n            <div style=\"border-top:1px solid #EDEBF2;padding:9px 0\">Logotype seul — <strong style=\"color:#221F2B\">96 px<\u002Fstrong> de large<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-bottom:10px\">Fonds admis<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n            <span style=\"border:1px solid #E2DDF0;padding:7px 13px;font-size:13px\">Blanc — signe violet<\u002Fspan>\n            <span style=\"border:1px solid #E2DDF0;padding:7px 13px;font-size:13px;background:#EDEAF7\">Lilas — signe violet profond<\u002Fspan>\n            <span style=\"padding:7px 13px;font-size:13px;background:#221F2B;color:#FFFFFF\">Encre — pastille violette<\u002Fspan>\n            <span style=\"padding:7px 13px;font-size:13px;background:#17161F;color:#F2F0F7\">Thème sombre — pastille violette<\u002Fspan>\n            <span style=\"padding:7px 13px;font-size:13px;background:#6B6579;color:#FFFFFF\">Photographie — pastille blanche<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:10px 0 0;font-size:13px;color:#6B6579;max-width:60ch\">La variante <em>sombre · encre<\u002Fem> est faite pour un fond <strong style=\"color:#221F2B\">clair<\u002Fstrong> : sur la page sombre elle ne mesure que 1,14:1 et disparaît. Sur tout fond foncé, c'est la pastille violette qui sert — la même qu'en clair.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-bottom:10px\">Usages proscrits<\u002Fdiv>\n          <ul style=\"margin:0;padding:0;list-style:none;display:grid;gap:0;font-size:14px;color:#6B6579\">\n            <li style=\"border-top:1px solid #EDEBF2;padding:9px 0\">Aucun dégradé, aucune ombre portée, aucun contour ajouté.<\u002Fli>\n            <li style=\"border-top:1px solid #EDEBF2;padding:9px 0\">Le violet <strong style=\"color:#221F2B\">#7B6BB7<\u002Fstrong> ne se pose pas sur l'encre, ni l'abricot sur le blanc : contraste insuffisant. Sur fond sombre, le violet s'éclaircit à <strong style=\"color:#221F2B\">#9C8BD8<\u002Fstrong> — voir le chapitre 09.<\u002Fli>\n            <li style=\"border-top:1px solid #EDEBF2;padding:9px 0\">Le signe ne se réduit pas sous 28 px, ne s'étire pas, ne se recolore pas hors palette.<\u002Fli>\n            <li style=\"border-top:1px solid #EDEBF2;padding:9px 0\">Le <span class=\"fr\">h<\u002Fspan> du logotype ne prend jamais l'abricot sur fond clair — l'abricot est réservé aux moments heureux dans l'interface.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin:0 0 76px\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #221F2B;padding-bottom:10px;margin-bottom:32px\">\n      <span style=\"font-weight:600;font-size:11px;letter-spacing:.14em;color:#9C97A8\">05<\u002Fspan>\n      <h2 class=\"fr\" style=\"font-weight:500;font-size:30px;letter-spacing:-.02em;margin:0\">La palette<\u002Fh2>\n      <span style=\"margin-left:auto;font-size:13px;color:#6B6579\">une couleur qui agit, une couleur qui réchauffe<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:14px\">\n      <div><div style=\"height:96px;background:#FFFFFF;border:1px solid #E2DDF0\"><\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:10px\">Papier<\u002Fdiv><div style=\"font-size:12px;color:#9C97A8\">#FFFFFF<\u002Fdiv><div style=\"font-size:11.5px;color:#6B6579;margin-top:4px\">Le fond de toute l'application<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"height:96px;background:#221F2B\"><\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:10px\">Encre<\u002Fdiv><div style=\"font-size:12px;color:#9C97A8\">#221F2B<\u002Fdiv><div style=\"font-size:11.5px;color:#6B6579;margin-top:4px\">Texte, à peine teinté de violet<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"height:96px;background:#7B6BB7\"><\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:10px\">Violet<\u002Fdiv><div style=\"font-size:12px;color:#9C97A8\">#7B6BB7<\u002Fdiv><div style=\"font-size:11.5px;color:#6B6579;margin-top:4px\">Boutons, liens, ce qui agit<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"height:96px;background:#EDEAF7\"><\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:10px\">Lilas<\u002Fdiv><div style=\"font-size:12px;color:#9C97A8\">#EDEAF7<\u002Fdiv><div style=\"font-size:11.5px;color:#6B6579;margin-top:4px\">Fonds d'habillage, mise en avant<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"height:96px;background:#F0CFB4\"><\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:10px\">Abricot<\u002Fdiv><div style=\"font-size:12px;color:#9C97A8\">#F0CFB4<\u002Fdiv><div style=\"font-size:11.5px;color:#6B6579;margin-top:4px\">L'accent chaud, rare : aujourd'hui, une bonne nouvelle<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:22px 0 0;color:#6B6579;max-width:78ch\"><strong style=\"color:#221F2B;font-weight:700\">Le violet ne teinte jamais le texte courant.<\u002Fstrong> Une fiche de proche se lit longuement : elle reste encre sur blanc. L'abricot n'apparaît qu'aux moments heureux — le jour même, un crédit reçu — ce qui l'empêche de devenir décoratif. Violet profond <span style=\"color:#5A4B93;font-weight:600\">#5A4B93<\u002Fspan> pour le texte violet et les fonds lilas ; gris de texte <span style=\"font-weight:600\">#6B6579<\u002Fspan>, gris de mention <span style=\"font-weight:600\">#9C97A8<\u002Fspan>, filets <span style=\"font-weight:600\">#EDEBF2<\u002Fspan>.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"margin:0 0 76px\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #221F2B;padding-bottom:10px;margin-bottom:32px\">\n      <span style=\"font-weight:600;font-size:11px;letter-spacing:.14em;color:#9C97A8\">06<\u002Fspan>\n      <h2 class=\"fr\" style=\"font-weight:500;font-size:30px;letter-spacing:-.02em;margin:0\">La typographie<\u002Fh2>\n      <span style=\"margin-left:auto;font-size:13px;color:#6B6579\">Fraunces &amp; Karla<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#EDEBF2;border:1px solid #EDEBF2\">\n      <div style=\"background:#FFFFFF;padding:30px 28px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:16px\">\n          <div class=\"fr\" style=\"font-size:20px;font-weight:500\">Fraunces<\u002Fdiv>\n          <div style=\"font-size:12px;color:#9C97A8\">titres, noms, décomptes · 400 et 500<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fr\" style=\"font-weight:500;font-size:34px;letter-spacing:-.02em;line-height:1.15\">Anniversaire de Karim<\u002Fdiv>\n        <div class=\"fr\" style=\"font-weight:500;font-size:22px;letter-spacing:-.01em;margin-top:12px\">Ce qu'on sait de lui<\u002Fdiv>\n        <div class=\"fr\" style=\"font-style:italic;font-size:18px;color:#6B6579;margin-top:10px\">« l'année où tu as tout osé »<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;padding:30px 28px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:16px\">\n          <div class=\"fr\" style=\"font-size:20px;font-weight:500\">Karla<\u002Fdiv>\n          <div style=\"font-size:12px;color:#9C97A8\">texte courant, libellés · 300 à 700<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:16px;max-width:52ch\">Elle a parlé d'un cours de céramique près de chez elle, ça lui plairait beaucoup. Noté en mars, retrouvé en septembre.<\u002Fdiv>\n        <div style=\"font-size:13px;color:#6B6579;margin-top:12px\">Souhait de Karim · ajouté le 12 août<\u002Fdiv>\n        <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-top:14px\">Prochaines échéances<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:22px 0 0;color:#6B6579;max-width:78ch\"><strong style=\"color:#221F2B;font-weight:700\">Pourquoi ces deux-là.<\u002Fstrong> Fraunces a des empattements souples et une légère irrégularité : elle écrit à la main sans imiter l'écriture manuscrite — c'est de là que vient l'intimité. Karla est humaniste, donc chaleureuse dans ses formes, mais assez neutre pour porter une fiche dense sans fatiguer. L'élégance tient à l'écart entre les deux : un titre qui a du caractère, un texte qui s'efface.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"margin:0 0 76px\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #221F2B;padding-bottom:10px;margin-bottom:32px\">\n      <span style=\"font-weight:600;font-size:11px;letter-spacing:.14em;color:#9C97A8\">07<\u002Fspan>\n      <h2 class=\"fr\" style=\"font-weight:500;font-size:30px;letter-spacing:-.02em;margin:0\">La signature — le décompte<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E2DDF0;padding:34px 30px;display:flex;gap:34px;align-items:center;flex-wrap:wrap\">\n      <div class=\"fr\" style=\"font-weight:400;font-size:76px;line-height:.9;letter-spacing:-.04em;color:#5A4B93\"><span style=\"color:#221F2B\">J<\u002Fspan>−3<\u002Fdiv>\n      <div style=\"flex:1;min-width:240px\">\n        <div class=\"fr\" style=\"font-size:22px;font-weight:500\">Karim Bah<\u002Fdiv>\n        <div style=\"color:#6B6579;font-size:14px;margin-top:2px\">Anniversaire · 24 août<\u002Fdiv>\n        <p style=\"font-size:13.5px;color:#6B6579;margin:12px 0 0;max-width:52ch\">Le décompte est l'élément que l'on reconnaît d'un écran à l'autre. Composé dans le caractère de titre, il devient un objet plutôt qu'une donnée — et il porte le nom du produit dans sa forme même.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin:0 0 76px\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #221F2B;padding-bottom:10px;margin-bottom:32px\">\n      <span style=\"font-weight:600;font-size:11px;letter-spacing:.14em;color:#9C97A8\">08<\u002Fspan>\n      <h2 class=\"fr\" style=\"font-weight:500;font-size:30px;letter-spacing:-.02em;margin:0\">En mouvement<\u002Fh2>\n      <button type=\"button\" sc-camel-on-click=\"{{ rejouer }}\" style=\"margin-left:auto;font-family:Karla,sans-serif;font-size:13px;font-weight:600;color:#5A4B93;background:transparent;border:1px solid #7B6BB7;border-radius:8px;padding:6px 14px;cursor:pointer\" style-hover=\"background:#EDEAF7\">Rejouer<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr auto;gap:2px;background:#EDEBF2;border:1px solid #EDEBF2;margin-bottom:28px\">\n      <div style=\"background:#FFFFFF;padding:44px 36px 36px\">\n        <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-bottom:28px\">Ouverture — le mot s'écrit, puis le h prend le violet<\u002Fdiv>\n        <sc-if value=\"{{ anime }}\" hint-placeholder-val=\"{{ true }}\">\n          <svg sc-camel-view-box=\"0 0 703.98 226.2\" width=\"520\" style=\"display:block;max-width:100%;overflow:visible\">\n            <g transform=\"translate(-9.900 221.700) scale(0.150000 -0.150000)\">\n              <g transform=\"translate(0.00 0)\"><clipPath id=\"pl1\"><rect x=\"56\" y=\"-120\" width=\"1039\" height=\"1720\" style=\"transform-origin:56px 0px;animation:lehno-ecrire .34s cubic-bezier(.36,0,.16,1) 0s both\"><\u002Frect><\u002FclipPath><path d=\"M566 1342L492 1329Q471 1323 460 1313Q449 1303 449 1285L449 117Q449 87 465.5 73.5Q482 60 511 60L734 60Q778 60 815 76Q852 92 885.5 133Q919 174 953 248L1024 405Q1031 419 1040 425Q1049 431 1061 428Q1075 427 1080 416Q1085 405 1080 387L993 16Q989 -10 980 -20Q971 -30 956 -30Q944 -30 927.5 -22.5Q911 -15 890.5 -7.5Q870 0 839 0L98 0Q82 0 74 7Q66 14 66 28Q66 50 92 58L167 71Q186 76 196.5 86.5Q207 97 207 115L207 1285Q207 1303 196.5 1313Q186 1323 167 1329L92 1342Q66 1350 66 1372Q66 1386 74 1393Q82 1400 98 1400L559 1400Q575 1400 583.5 1393Q592 1386 592 1372Q592 1350 566 1342Z\" fill=\"#221F2B\" clip-path=\"url(#pl1)\"><\u002Fp
