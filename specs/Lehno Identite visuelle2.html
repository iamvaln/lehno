rm=\"translate(2839.60 0)\"><clipPath id=\"pl4\"><rect x=\"25\" y=\"-120\" width=\"1022\" height=\"1720\" style=\"transform-origin:25px 0px;animation:lehno-ecrire .34s cubic-bezier(.36,0,.16,1) 0.66s both\"><\u002Frect><\u002FclipPath><path d=\"M350 859L350 106Q350 83 357 72Q364 61 380 56L429 48Q446 40 446 23Q446 0 421 0L66 0Q55 0 47.5 7Q40 14 40 23Q40 31 45 37.5Q50 44 59 50L109 58Q124 62 131.5 73Q139 84 139 105L139 730Q139 746 134.5 753.5Q130 761 116 762L55 763Q45 767 40 772Q35 777 35 786Q35 795 41.5 801.5Q48 808 61 813L275 877Q294 884 304 886Q314 888 322 888Q335 888 342.5 880Q350 872 350 859ZM330 657L307 684L343 721Q441 812 514.5 852.5Q588 893 655 893Q752 893 802.5 833Q853 773 869 656L941 110Q944 86 950 74Q956 62 975 58L1017 50Q1028 45 1032.5 38Q1037 31 1037 23Q1037 14 1031 7Q1025 0 1011 0L653 0Q628 0 628 23Q628 40 645 48L694 56Q713 61 721 73.5Q729 86 726 108L662 611Q651 694 620.5 733.5Q590 773 532 773Q491 773 450.5 753Q410 733 365 688Z\" fill=\"#221F2B\" clip-path=\"url(#pl4)\"><\u002Fpath><\u002Fg>\n              <g transform=\"translate(3822.20 0)\"><clipPath id=\"pl5\"><rect x=\"32\" y=\"-120\" width=\"915\" height=\"1720\" style=\"transform-origin:32px 0px;animation:lehno-ecrire .34s cubic-bezier(.36,0,.16,1) 0.88s both\"><\u002Frect><\u002FclipPath><path d=\"M494 893Q624 893 723.5 834.5Q823 776 880 672.5Q937 569 937 435Q937 304 879 201Q821 98 719 39.5Q617 -19 485 -19Q355 -19 255.5 38.5Q156 96 99 198.5Q42 301 42 435Q42 567 99.5 670.5Q157 774 259.5 833.5Q362 893 494 893ZM551 39Q615 46 657.5 99.5Q700 153 715 246.5Q730 340 712 467Q696 599 654.5 684Q613 769 556 806.5Q499 844 431 835Q364 828 321.5 773Q279 718 265.5 625.5Q252 533 268 407Q288 277 328.5 191.5Q369 106 426 68Q483 30 551 39Z\" fill=\"#221F2B\" clip-path=\"url(#pl5)\"><\u002Fpath><\u002Fg>\n            <\u002Fg>\n          <\u002Fsvg>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;padding:44px 36px 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px\">\n        <sc-if value=\"{{ anime }}\" hint-placeholder-val=\"{{ true }}\">\n          <svg sc-camel-view-box=\"0 0 512 512\" width=\"150\" height=\"150\" style=\"display:block\">\n            <rect width=\"512\" height=\"512\" rx=\"113\" fill=\"#7B6BB7\" style=\"transform-box:fill-box;transform-origin:center;animation:lehno-tuile .5s cubic-bezier(.22,.8,.24,1) 0s both\"><\u002Frect>\n            <g transform=\"translate(146.23 407.500) scale(0.205000 -0.205000)\"><clipPath id=\"plIcone\"><rect x=\"24\" y=\"-120\" width=\"1023\" height=\"1720\" style=\"transform-origin:24px 0px;animation:lehno-ecrire .46s cubic-bezier(.36,0,.16,1) .2s both\"><\u002Frect><\u002FclipPath><path d=\"M348 1448L348 106Q348 83 354.5 72Q361 61 378 56L426 48Q444 40 444 23Q444 0 418 0L64 0Q53 0 45.5 7Q38 14 38 23Q38 31 43 38Q48 45 60 51L108 58Q123 62 129.5 73Q136 84 136 105L136 1320Q136 1336 132 1342.5Q128 1349 115 1352L54 1353Q43 1356 38.5 1361.5Q34 1367 34 1375Q34 1385 39.5 1391.5Q45 1398 58 1403L273 1468Q293 1474 302 1476Q311 1478 320 1478Q334 1478 341 1470Q348 1462 348 1448ZM327 659L305 686L340 723Q438 814 511.5 853.5Q585 893 651 893Q749 893 800.5 832Q852 771 869 649L939 110Q942 86 948.5 74Q955 62 974 58L1016 50Q1026 45 1030.5 38Q1035 31 1035 23Q1035 14 1028.5 7Q1022 0 1010 0L651 0Q625 0 625 23Q625 40 644 48L693 56Q712 61 719.5 73.5Q727 86 725 108L662 603Q650 691 619 732Q588 773 528 773Q489 773 449.5 753.5Q410 734 363 690Z\" fill=\"#FFFFFF\" clip-path=\"url(#plIcone)\"><\u002Fpath><\u002Fg>\n          <\u002Fsvg>\n        <\u002Fsc-if>\n        <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600\">Lancement<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:44px\">\n      <p style=\"margin:0;color:#6B6579\">À l'ouverture, le nom se trace de gauche à droite, lettre après lettre, comme on l'écrirait à la main : chacune se dévoile en 340 ms, la suivante part 220 ms plus tard. Le mot une fois posé, le <span class=\"fr\" style=\"color:#7B6BB7\">h<\u002Fspan> passe de l'encre au violet — la lettre muette se révèle en dernier. Une fois par session, jamais en boucle, jamais sous 120 px, et l'état final est exactement le logo statique.<\u002Fp>\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-bottom:10px\">La partition<\u002Fdiv>\n        <div style=\"display:grid;gap:0;font-size:14px;color:#6B6579\">\n          <div style=\"border-top:1px solid #EDEBF2;padding:8px 0;display:flex;gap:14px\"><span class=\"fr\" style=\"color:#5A4B93;min-width:86px\">0 → 1,22 s<\u002Fspan><span>Chaque lettre se dévoile de sa gauche vers sa droite en 340 ms ; la suivante part 220 ms après.<\u002Fspan><\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:8px 0;display:flex;gap:14px\"><span class=\"fr\" style=\"color:#5A4B93;min-width:86px\">1,05 s<\u002Fspan><span>Le mot est complet ; le <span class=\"fr\">h<\u002Fspan> vire de l'encre au violet.<\u002Fspan><\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:8px 0;display:flex;gap:14px\"><span class=\"fr\" style=\"color:#5A4B93;min-width:86px\">1,95 s<\u002Fspan><span>Fin — l'état d'arrêt est exactement le fichier statique.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:14px 0 0;font-size:13.5px;color:#6B6579\">La séquence sur fond encre et le détail complet sont dans la planche <strong style=\"color:#221F2B;font-weight:600\">Logo animé Lehno<\u002Fstrong>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin:0 0 76px\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #221F2B;padding-bottom:10px;margin-bottom:32px\">\n      <span style=\"font-weight:600;font-size:11px;letter-spacing:.14em;color:#9C97A8\">09<\u002Fspan>\n      <h2 class=\"fr\" style=\"font-weight:500;font-size:30px;letter-spacing:-.02em;margin:0\">Le thème sombre<\u002Fh2>\n      <span style=\"margin-left:auto;font-size:13px;color:#6B6579\">un second jeu, pas un inverse<\u002Fspan>\n    <\u002Fdiv>\n\n    <p style=\"margin:0 0 26px;color:#6B6579;max-width:74ch\">Le thème sombre n'inverse pas la palette claire : il la rejoue. Deux couleurs changent de valeur pour rester lisibles, une troisième change de rôle. Ce qui ne bouge pas : l'abricot, qui tient sur les deux fonds, et la rareté de son emploi.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:14px\">\n      <div><div style=\"height:96px;background:#17161F\"><\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:10px\">Fond<\u002Fdiv><div style=\"font-size:12px;color:#9C97A8\">#17161F<\u002Fdiv><div style=\"font-size:11.5px;color:#6B6579;margin-top:4px\">Le papier du thème sombre<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"height:96px;background:#2E2945\"><\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:10px\">Lilas sombre<\u002Fdiv><div style=\"font-size:12px;color:#9C97A8\">#2E2945<\u002Fdiv><div style=\"font-size:11.5px;color:#6B6579;margin-top:4px\">Fonds d'habillage, cartes en avant<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"height:96px;background:#9C8BD8\"><\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:10px\">Violet clair<\u002Fdiv><div style=\"font-size:12px;color:#9C97A8\">#9C8BD8<\u002Fdiv><div style=\"font-size:11.5px;color:#6B6579;margin-top:4px\">Ce qui agit — remplace #7B6BB7<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"height:96px;background:#41357E\"><\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:10px\">Aplat de clôture<\u002Fdiv><div style=\"font-size:12px;color:#9C97A8\">#41357E<\u002Fdiv><div style=\"font-size:11.5px;color:#6B6579;margin-top:4px\">Rôle nouveau : l'encre ne tranche pas sur l'encre<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"height:96px;background:#F0CFB4\"><\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:10px\">Abricot<\u002Fdiv><div style=\"font-size:12px;color:#9C97A8\">#F0CFB4<\u002Fdiv><div style=\"font-size:11.5px;color:#6B6579;margin-top:4px\">Inchangé — il tient sur les deux thèmes<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-top:30px\">\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-bottom:10px\">Textes et filets<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:0 28px;font-size:14px;color:#6B6579\">\n          <div style=\"border-top:1px solid #EDEBF2;padding:9px 0\">Texte — <strong style=\"color:#221F2B\">#F2F0F7<\u002Fstrong><\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:9px 0\">Texte secondaire — <strong style=\"color:#221F2B\">#B9B4C6<\u002Fstrong><\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:9px 0\">Mentions — <strong style=\"color:#221F2B\">#9A94A8<\u002Fstrong><\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:9px 0\">Violet de texte — <strong style=\"color:#221F2B\">#C3B4EE<\u002Fstrong><\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:9px 0\">Filets — <strong style=\"color:#221F2B\">#3D3757<\u002Fstrong><\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:9px 0\">Bordures d'action — <strong style=\"color:#221F2B\">#726C96<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-bottom:10px\">La règle d'écart<\u002Fdiv>\n        <p style=\"margin:0;color:#6B6579\">Un même écart de clarté se voit moins dans les basses lumières. Entre le fond et le lilas, il faut <strong style=\"color:#221F2B\">ΔL* 10,6<\u002Fstrong> en sombre pour obtenir la lecture que <strong style=\"color:#221F2B\">ΔL* 6,7<\u002Fstrong> donne en clair — environ une fois et demie. Toute alternance de fonds reprise du thème clair doit être re-mesurée, jamais transposée.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#EDEBF2;border:1px solid #EDEBF2;margin-top:30px\">\n      <div style=\"background:#FFFFFF;padding:34px 30px\">\n        <img src=\"08524325-029d-4748-ac16-2e76d4646b2b\" alt=\"Lehno\" style=\"display:block;width:260px;max-width:100%\">\n        <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9C97A8;margin-top:20px\">Thème clair — logotype couleur<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#17161F;padding:34px 30px\">\n        <img src=\"586dc620-7ab0-4140-8bb1-030b9fff723e\" alt=\"Lehno\" style=\"display:block;width:260px;max-width:100%\">\n        <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9C97A8;margin-top:20px\">Thème sombre — logotype blanc<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:14px 0 0;color:#6B6579;max-width:74ch\"><strong style=\"color:#221F2B;font-weight:700\">Ne pas confondre avec la version « sur encre ».<\u002Fstrong> Celle-ci embarque sa plaque de fond <span style=\"color:#221F2B\">#221F2B<\u002Fspan> et une marge, pour se poser sur un aplat encre. Sur une page sombre elle laisse un rectangle plus clair visible et réduit la marque de 24 %. Le fichier du thème sombre est <strong style=\"color:#221F2B\">lehno-logotype-blanc.svg<\u002Fstrong> : fond transparent, même boîte 704 × 226 que la version couleur, donc taille identique au basculement.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"margin:0 0 76px\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #221F2B;padding-bottom:10px;margin-bottom:32px\">\n      <span style=\"font-weight:600;font-size:11px;letter-spacing:.14em;color:#9C97A8\">10<\u002Fspan>\n      <h2 class=\"fr\" style=\"font-weight:500;font-size:30px;letter-spacing:-.02em;margin:0\">Les boutons<\u002Fh2>\n      <span style=\"margin-left:auto;font-size:13px;color:#6B6579\">web · mobile · les trois rangs<\u002Fspan>\n    <\u002Fdiv>\n\n    <p style=\"margin:0 0 26px;color:#6B6579;max-width:74ch\">Trois rangs, jamais plus sur un même écran : un seul bouton plein par vue, l'action qui fait avancer. Le contour porte l'alternative, le texte seul les actions de service. Le rayon est de 10 px sur le web, 12 px en mobile — l'écart suit la taille du doigt, pas le goût.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#EDEBF2;border:1px solid #EDEBF2\">\n      <div style=\"background:#FFFFFF;padding:30px 28px\">\n        <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-bottom:20px\">Web — hauteur 40 px, texte 15 px<\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\">\n          <span style=\"background:#7B6BB7;color:#FFFFFF;padding:10px 18px;border-radius:10px;font-weight:600;font-size:15px\">Commencer<\u002Fspan>\n          <span style=\"border:1px solid #7B6BB7;color:#5A4B93;padding:9px 18px;border-radius:10px;font-weight:600;font-size:15px\">Voir la liste<\u002Fspan>\n          <span style=\"color:#5A4B93;padding:10px 12px;font-weight:600;font-size:15px\">Plus tard<\u002Fspan>\n          <span style=\"background:#B3261E;color:#FFFFFF;padding:10px 18px;border-radius:10px;font-weight:600;font-size:15px\">Supprimer<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:0 24px;font-size:13.5px;color:#6B6579;margin-top:22px\">\n          <div style=\"border-top:1px solid #EDEBF2;padding:8px 0\">Repos — <strong style=\"color:#221F2B\">#7B6BB7<\u002Fstrong><\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:8px 0\">Survol — <strong style=\"color:#221F2B\">#5A4B93<\u002Fstrong><\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:8px 0\">Enfoncé — <strong style=\"color:#221F2B\">#4A3D7C<\u002Fstrong><\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:8px 0\">Inactif — opacité 45 %<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;padding:30px 28px\">\n        <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-bottom:20px\">Mobile — hauteur 48 px minimum, texte 16 px<\u002Fdiv>\n        <div style=\"display:grid;gap:10px;max-width:280px\">\n          <div style=\"background:#7B6BB7;color:#FFFFFF;padding:14px;border-radius:12px;font-weight:600;font-size:16px;text-align:center\">Préparer<\u002Fdiv>\n          <div style=\"border:1px solid #7B6BB7;color:#5A4B93;padding:13px;border-radius:12px;font-weight:600;font-size:16px;text-align:center\">Marquer envoyé<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n            <div style=\"border:1px solid #E2DDF0;color:#6B6579;padding:11px;border-radius:10px;font-weight:600;font-size:14px;text-align:center\">Reporter<\u002Fdiv>\n            <div style=\"border:1px solid #B3261E;color:#B3261E;padding:11px;border-radius:10px;font-weight:600;font-size:14px;text-align:center\">Supprimer<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:20px 0 0;font-size:13.5px;color:#6B6579;max-width:40ch\">La cible tactile ne descend jamais sous 44 px, même quand le fond visible est plus court. Deux boutons côte à côte n'occupent la même largeur que s'ils ont le même poids.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#17161F;padding:30px 28px;margin-top:2px;border:1px solid #EDEBF2;border-top:none\">\n      <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9A94A8;font-weight:600;margin-bottom:20px\">Thème sombre — le violet s'éclaircit, le blanc devient encre<\u002Fdiv>\n      <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\">\n        <span style=\"background:#9C8BD8;color:#15131D;padding:10px 18px;border-radius:10px;font-weight:600;font-size:15px\">Commencer<\u002Fspan>\n        <span style=\"border:1px solid #9C8BD8;color:#C3B4EE;padding:9px 18px;border-radius:10px;font-weight:600;font-size:15px\">Voir la liste<\u002Fspan>\n        <span style=\"color:#C3B4EE;padding:10px 12px;font-weight:600;font-size:15px\">Plus tard<\u002Fspan>\n        <span style=\"background:#F2837A;color:#2A0F0C;padding:10px 18px;border-radius:10px;font-weight:600;font-size:15px\">Supprimer<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:18px 0 0;font-size:13.5px;color:#B9B4C6;max-width:70ch\">Sur fond sombre le texte du bouton plein passe à l'encre <strong style=\"color:#F2F0F7\">#15131D<\u002Fstrong> : un blanc sur violet clair ne mesure que 2,96:1. L'encre donne 6,2:1 au repos, 8,0:1 au survol <strong style=\"color:#F2F0F7\">#B0A2E2<\u002Fstrong> et 4,9:1 à l'enfoncé <strong style=\"color:#F2F0F7\">#8877CC<\u002Fstrong>.<\u002Fp>\n    <\u002Fdiv>\n\n    <p style=\"margin:20px 0 0;color:#6B6579;max-width:74ch\"><strong style=\"color:#221F2B;font-weight:700\">Il n'y a pas de bouton « succès ».<\u002Fstrong> Le succès est un état, pas une action : on ne clique pas sur une réussite. Un bouton vert n'aurait de sens que pour confirmer, et c'est déjà le rôle du bouton plein. Ce que le succès demande, c'est un bandeau — voir le chapitre suivant.<\u002Fp>\n    <p style=\"margin:14px 0 0;color:#6B6579;max-width:74ch\"><strong style=\"color:#221F2B;font-weight:700\">Le focus clavier ne se supprime jamais.<\u002Fstrong> Contour de 2 px en violet, décalé de 2 px — sur les deux thèmes, sur tous les rangs, y compris le bouton texte. C'est la seule bordure que la marque ajoute sans qu'on la dessine.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"margin:0 0 76px\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #221F2B;padding-bottom:10px;margin-bottom:32px\">\n      <span style=\"font-weight:600;font-size:11px;letter-spacing:.14em;color:#9C97A8\">11<\u002Fspan>\n      <h2 class=\"fr\" style=\"font-weight:500;font-size:30px;letter-spacing:-.02em;margin:0\">Les messages, les icônes, le mouvement<\u002Fh2>\n      <span style=\"margin-left:auto;font-size:13px;color:#6B6579\">information · succès · avertissement · erreur<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-bottom:16px\">Les quatre couleurs de message<\u002Fdiv>\n    <p style=\"margin:0 0 20px;color:#6B6579;max-width:74ch\">Quatre intentions, quatre couleurs — et l'information n'en reçoit pas de nouvelle : c'est le violet de la marque qui parle, puisque c'est le produit qui s'adresse à vous. L'abricot reste hors de ce jeu ; il célèbre, il n'avertit pas.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px\">\n      <div><div style=\"height:66px;background:#5A4B93\"><\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:10px\">Information<\u002Fdiv><div style=\"font-size:12px;color:#9C97A8\">#5A4B93 · #C3B4EE<\u002Fdiv><div style=\"font-size:11.5px;color:#6B6579;margin-top:4px\">Le violet profond de la marque<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"height:66px;background:#166B43\"><\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:10px\">Succès<\u002Fdiv><div style=\"font-size:12px;color:#9C97A8\">#166B43 · #7ED9A6<\u002Fdiv><div style=\"font-size:11.5px;color:#6B6579;margin-top:4px\">6,5:1 sur blanc · 10,6:1 sur sombre<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"height:66px;background:#8A5A00\"><\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:10px\">Avertissement<\u002Fdiv><div style=\"font-size:12px;color:#9C97A8\">#8A5A00 · #E3B25C<\u002Fdiv><div style=\"font-size:11.5px;color:#6B6579;margin-top:4px\">Ambre saturé — jamais l'abricot<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"height:66px;background:#B3261E\"><\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:10px\">Erreur<\u002Fdiv><div style=\"font-size:12px;color:#9C97A8\">#B3261E · #F2837A<\u002Fdiv><div style=\"font-size:11.5px;color:#6B6579;margin-top:4px\">6,5:1 sur blanc · 7,1:1 sur sombre · 5,5:1 sur les deux lilas<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-bottom:16px\">Les bandeaux<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#EDEBF2;border:1px solid #EDEBF2;margin-bottom:14px\">\n      <div style=\"background:#FFFFFF;padding:24px 22px;display:grid;gap:10px\">\n        <div style=\"background:#EDEAF7;color:#5A4B93;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 16v-5M12 8h.01\"><\u002Fpath><\u002Fsvg>\n          <span>Votre Mur est visible par toute personne ayant le lien.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#E6F4EC;color:#166B43;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8.5 12.5 2.5 2.5 4.5-5\"><\u002Fpath><\u002Fsvg>\n          <span>Message envoyé à Valery.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#FBF0DC;color:#8A5A00;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:1px\"><path d=\"M10.3 4.3 2.6 18a1.9 1.9 0 0 0 1.7 2.9h15.4a1.9 1.9 0 0 0 1.7-2.9L13.7 4.3a1.9 1.9 0 0 0-3.4 0Z\"><\u002Fpath><path d=\"M12 10v4M12 18h.01\"><\u002Fpath><\u002Fsvg>\n          <span>Il vous reste un crédit.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#FBEAE8;color:#B3261E;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M15 9l-6 6M9 9l6 6\"><\u002Fpath><\u002Fsvg>\n          <span>Ce lien n'est plus valable.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#17161F;padding:24px 22px;display:grid;gap:10px\">\n        <div style=\"background:#2E2945;color:#C3B4EE;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 16v-5M12 8h.01\"><\u002Fpath><\u002Fsvg>\n          <span>Votre Mur est visible par toute personne ayant le lien.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#163024;color:#7ED9A6;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8.5 12.5 2.5 2.5 4.5-5\"><\u002Fpath><\u002Fsvg>\n          <span>Message envoyé à Valery.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#322814;color:#E3B25C;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:1px\"><path d=\"M10.3 4.3 2.6 18a1.9 1.9 0 0 0 1.7 2.9h15.4a1.9 1.9 0 0 0 1.7-2.9L13.7 4.3a1.9 1.9 0 0 0-3.4 0Z\"><\u002Fpath><path d=\"M12 10v4M12 18h.01\"><\u002Fpath><\u002Fsvg>\n          <span>Il vous reste un crédit.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#35191A;color:#F2837A;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M15 9l-6 6M9 9l6 6\"><\u002Fpath><\u002Fsvg>\n          <span>Ce lien n'est plus valable.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 30px;color:#6B6579;max-width:74ch\">Fonds teintés : <strong style=\"color:#221F2B\">#EDEAF7<\u002Fstrong> · <strong style=\"color:#221F2B\">#E6F4EC<\u002Fstrong> · <strong style=\"color:#221F2B\">#FBF0DC<\u002Fstrong> · <strong style=\"color:#221F2B\">#FBEAE8<\u002Fstrong> en clair ; <strong style=\"color:#221F2B\">#2E2945<\u002Fstrong> · <strong style=\"color:#221F2B\">#163024<\u002Fstrong> · <strong style=\"color:#221F2B\">#322814<\u002Fstrong> · <strong style=\"color:#221F2B\">#35191A<\u002Fstrong> en sombre. Le texte y tient de 5,3:1 à 8,3:1. Angles droits, aucune bordure, aucune ombre : le bandeau est une bande, pas une carte. Une icône, une phrase, et l'action de fermeture seulement si le message survit au changement d'écran.<\u002Fp>\n\n    <p style=\"margin:0 0 30px;color:#6B6579;max-width:74ch\">Le rouge ne sert qu'à trois choses : l'erreur de saisie, l'action destructrice, l'état hors service. Il ne décore pas, il ne souligne pas, il ne signale pas l'urgence d'une date. <strong style=\"color:#221F2B;font-weight:700\">Il ne côtoie jamais l'abricot<\u002Fstrong> — deux couleurs chaudes voisines et l'une des deux cesse d'être un signal.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:44px\">\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-bottom:16px\">La grille d'icônes<\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:flex-end;margin-bottom:16px\">\n          <div style=\"text-align:center\">\n            <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5A4B93\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M16 2v4M8 2v4M3 10h18\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:11px;color:#9C97A8;margin-top:6px\">28<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5A4B93\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:11px;color:#9C97A8;margin-top:6px\">20<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center\">\n            <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5A4B93\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"><\u002Fpath><path d=\"M13.7 21a2 2 0 0 1-3.4 0\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:11px;color:#9C97A8;margin-top:6px\">17<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9C97A8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:11px;color:#9C97A8;margin-top:6px\">15<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:0;font-size:14px;color:#6B6579\">\n          <div style=\"border-top:1px solid #EDEBF2;padding:8px 0\">Famille — <strong style=\"color:#221F2B\">Lucide<\u002Fstrong>, contours ouverts, aucune icône pleine<\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:8px 0\">Grille — <strong style=\"color:#221F2B\">24 × 24<\u002Fstrong>, taille de référence <strong style=\"color:#221F2B\">20 px<\u002Fstrong><\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:8px 0\">Trait — <strong style=\"color:#221F2B\">1,8<\u002Fstrong> pour le contenu, <strong style=\"color:#221F2B\">2<\u002Fstrong> sous 16 px et pour les chevrons<\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:8px 0\">Extrémités et angles arrondis, toujours<\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:8px 0\">Couleur — la couleur du texte qu'elle accompagne, jamais une couleur propre<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9C97A8;font-weight:600;margin-bottom:16px\">Durées et courbes<\u002Fdiv>\n        <div style=\"display:grid;gap:0;font-size:14px;color:#6B6579\">\n          <div style=\"border-top:1px solid #EDEBF2;padding:9px 0;display:flex;gap:14px\"><span class=\"fr\" style=\"color:#5A4B93;min-width:74px\">120 ms<\u002Fspan><span>Survol, focus, changement d'état d'un bouton — <span style=\"font-size:13px\">ease-out<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:9px 0;display:flex;gap:14px\"><span class=\"fr\" style=\"color:#5A4B93;min-width:74px\">220 ms<\u002Fspan><span>Apparition d'une carte, ouverture d'un accordéon, bascule de thème — <span style=\"font-size:13px\">cubic-bezier(.22,.8,.24,1)<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"border-top:1px solid #EDEBF2;padding:9px 0;display:flex;gap:14px\"><span class=\"fr\" style=\"color:#5A4B93;min-width:74px\">340 ms<\u002Fspan><span>Changement d'écran, panneau qui entre — <span style=\"font-size:13px\">cubic-bezier(.36,0,.16,1)<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:16px 0 0;font-size:13.5px;color:#6B6579\">Deux courbes seulement, celles du logo animé : la <strong style=\"color:#221F2B\">.22,.8,.24,1<\u002Fstrong> pour ce qui se pose, la <strong style=\"color:#221F2B\">.36,0,.16,1<\u002Fstrong> pour ce qui traverse. Rien ne rebondit, rien ne dépasse.<\u002Fp>\n        <p style=\"margin:12px 0 0;font-size:13.5px;color:#6B6579\"><strong style=\"color:#221F2B;font-weight:700\">prefers-reduced-motion<\u002Fstrong> supprime toute durée : les éléments prennent leur état final d'emblée. Ce n'est pas une dégradation, c'est une des deux manières prévues d'afficher la marque.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section>\n    <div style=\"display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #221F2B;padding-bottom:10px;margin-bottom:32px\">\n      <span style=\"font-weight:600;font-size:11px;letter-spacing:.14em;color:#9C97A8\">12<\u002Fspan>\n      <h2 class=\"fr\" style=\"font-weight:500;font-size:30px;letter-spacing:-.02em;margin:0\">Les fichiers<\u002Fh2>\n      <span style=\"margin-left:auto;font-size:13px;color:#6B6579\">vectorisés · aucune police requise<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:44px\">\n      <div>\n        <ul style=\"margin:0;padding:0;list-style:none;font-size:14px;color:#6B6579\">\n          <li style=\"border-top:1px solid #EDEBF2;padding:9px 0\"><a href=\"exports/lehno-logotype-couleur.svg\" download=\"\">lehno-logotype-couleur.svg<\u002Fa> — usage courant<\u002Fli>\n          <li style=\"border-top:1px solid #EDEBF2;padding:9px 0\"><a href=\"exports/lehno-logotype-inverse.svg\" download=\"\">lehno-logotype-inverse.svg<\u002Fa> — sur encre<\u002Fli>\n          <li style=\"border-top:1px solid #EDEBF2;padding:9px 0\"><a href=\"exports/lehno-logotype-une-encre.svg\" download=\"\">lehno-logotype-une-encre.svg<\u002Fa> — monochrome<\u002Fli>\n          <li style=\"border-top:1px solid #EDEBF2;padding:9px 0\"><a href=\"exports/lehno-logotype-blanc.svg\" download=\"\">lehno-logotype-blanc.svg<\u002Fa> — thème sombre, fond transparent<\u002Fli>\n          <li style=\"border-top:1px solid #EDEBF2;padding:9px 0\"><a href=\"exports/lehno-icone-512.svg\" download=\"\">lehno-icone-512.svg<\u002Fa> + variantes ronde, claire, sombre, une encre<\u002Fli>\n          <li style=\"border-top:1px solid #EDEBF2;padding:9px 0\"><a href=\"exports/lehno-favicon-28.svg\" download=\"\">lehno-favicon-28.svg<\u002Fa> — tracé épaissi<\u002Fli>\n          <li style=\"border-top:1px solid #EDEBF2;padding:9px 0\"><a href=\"exports/lehno-verrouillage-horizontal.svg\" download=\"\">verrouillage horizontal<\u002Fa> · <a href=\"exports/lehno-verrouillage-empile.svg\" download=\"\">empilé<\u002Fa><\u002Fli>\n          <li style=\"border-top:1px solid #EDEBF2;padding:9px 0\">PNG : <a
