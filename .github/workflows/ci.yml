name: CI

# Barrière de qualité sur `main`, APRÈS fusion. Ne déploie jamais — voir
# release.yml, déclenché uniquement par un tag git `v*`.
#
# CE QU'ON A RETIRÉ, ET CE QU'ON ÉCHANGE.
#
# La vérification tournait aussi sur chaque PR et sur chaque poussée vers
# `develop`. Elle dure vingt minutes, et le coût ne s'arrêtait pas là : chaque
# fusion mettait les PR restantes en retard, ce qui en déclenchait une nouvelle
# à chaque fois. Trois correctifs pouvaient faire tourner la chaîne cinq fois.
#
# Ce qu'on perd est la DÉTECTION PRÉCOCE : un commit cassé peut désormais dormir
# sur `develop` jusqu'à ce que quelqu'un taille une release. C'est exactement le
# scénario qui avait motivé la surveillance de `develop` — la CI était restée
# rouge du 24 août sans que personne ne le voie.
#
# Ce qu'on garde, et qui est la vraie garde : `release.yml` appelle la MÊME
# définition (verification.yml) avant de construire les images et de déployer.
# Rien ne part en production sans être vérifié. La panne se découvre au moment
# de publier plutôt qu'au moment d'écrire — plus tard, mais jamais chez
# l'utilisateur.
#
# Les contrôles requis ont été retirés de la protection de `develop` et de
# `main` en même temps : sans exécution sur les PR, un contrôle exigé ne paraît
# jamais, et plus rien ne peut être fusionné.
on:
  push:
    branches: [main]

# Annule les exécutions périmées sur la même réf pour économiser des minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Les étapes vivent dans verification.yml, que release.yml appelle aussi :
  # une seule définition, deux chaînes. Les recopier ici les ferait diverger,
  # et le déploiement finirait par vérifier moins que la CI.
  verifier:
    uses: ./.github/workflows/verification.yml
    secrets: inherit
