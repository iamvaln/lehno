name: CI

# Barrières de qualité sur chaque PR et sur les push vers develop et main. Ne
# déploie jamais — voir release.yml, déclenché uniquement par un tag git `v*`.
#
# `develop` y figure parce que c'est la branche où le travail atterrit : les
# agents y poussent directement, sans passer par une PR. Tant qu'elle n'était
# pas surveillée, rien ne vérifiait ce qui s'y accumulait — et la CI a pu
# rester rouge sur main du 24 août sans que personne ne s'en aperçoive.
on:
  pull_request:
  push:
    branches: [develop, main]

# Annule les exécutions périmées sur la même réf pour économiser des minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Les étapes vivent dans verification.yml, que release.yml appelle aussi :
  # une seule définition, deux chaînes. Les recopier ici les ferait diverger,
  # et le déploiement finirait par vérifier moins que la CI.
  verifier:
    uses: ./.github/workflows/verification.yml
    secrets: inherit
