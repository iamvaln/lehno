services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lehno
      POSTGRES_PASSWORD: lehno
      POSTGRES_DB: lehno
    ports: ["5432:5432"]
    volumes: ["lehno-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lehno"]
      interval: 5s
      retries: 10
volumes:
  lehno-db:
