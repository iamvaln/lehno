services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lehno
      POSTGRES_PASSWORD: lehno
      POSTGRES_DB: lehno
    # 5433 côté hôte : 5432 est souvent déjà pris par un PostgreSQL local (pas le conteneur qui bouge, la porte d'entrée).
    ports: ["5433:5432"]
    volumes: ["lehno-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lehno"]
      interval: 5s
      retries: 10
volumes:
  lehno-db:
