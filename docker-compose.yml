# Lehno — pile de production (un projet parmi d'autres sur un VPS partagé).
# Le routage/TLS est géré par le Traefik partagé du VPS, sur le réseau
# externe « web » (voir deploy/CICD.md). Démarre cette pile avec :
#   docker compose --env-file .env.production up -d
#
# Le VPS ne construit jamais ces images : « docker compose pull » les tire
# depuis GHCR (voir .github/workflows/release.yml). Les blocs « build: »
# ci-dessous ne servent qu'au développement local d'image
# (docker compose build) — en production, le tag d'image publié l'emporte.
#
# Ne pas confondre avec infra/docker/compose.yml : celui-ci sert le
# développement local (base sur le port 5433, pas d'images publiées).
name: lehno

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - lehno-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  # ── Ponctuel : applique les migrations Prisma, puis s'arrête. ───────────────
  # Même image que « api », commande différente — pas de « prisma migrate
  # deploy » au démarrage de l'api elle-même (voir apps/api/Dockerfile) : un
  # service dédié qui s'arrête évite des migrations concurrentes si l'api
  # tourne un jour à plus d'une réplique.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${REGISTRY:-ghcr.io/iamvaln}/lehno-api:${IMAGE_TAG:-latest}
    env_file: ${ENV_FILE:-.env.production}
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # ── API (NestJS, préfixe /v1) ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${REGISTRY:-ghcr.io/iamvaln}/lehno-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      # Un seul relais devant l'API : le Traefik partagé du VPS. Sans ce
      # réglage, req.ip vaudrait l'adresse de Traefik pour tout le monde et le
      # plafond « par origine » deviendrait un compteur unique partagé — le
      # onzième visiteur de l'heure refusé à cause des dix précédents.
      #
      # La valeur 1 n'est sûre que parce que ce service ne publie aucun port :
      # il n'est joignable QUE par Traefik, qui réécrit X-Forwarded-For. Si on
      # exposait un jour son port en direct, un client pourrait forger cet
      # en-tête et s'accorder autant d'origines qu'il veut. Voir
      # apps/api/src/common/trust-proxy.ts.
      TRUST_PROXY_HOPS: '1'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # « internal » pour parler à la base ; « web » pour le routage public
    # Traefik — le formulaire de liste d'attente poste directement depuis le
    # navigateur sur /v1/public/waitlist (voir apps/web/.env.example), l'api
    # doit donc être joignable publiquement, pas seulement en interne.
    networks: [internal, web]
    # HEALTHCHECK déjà défini dans l'image (apps/api/Dockerfile) — repris tel
    # quel par Compose, pas besoin de le redéclarer ici.
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.${STACK:-lehno}-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.${STACK:-lehno}-api.entrypoints=websecure
      - traefik.http.routers.${STACK:-lehno}-api.tls.certresolver=le
      - traefik.http.services.${STACK:-lehno}-api.loadbalancer.server.port=3000

  # ── Site public (Next.js App Router) ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: ${REGISTRY:-ghcr.io/iamvaln}/lehno-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    depends_on:
      api:
        condition: service_healthy
    # « internal » : le rendu serveur lit /v1/public/config via API_URL, en
    # visant le nom de service Docker (http://api:3000) plutôt que le domaine
    # public — plus court, ne dépend pas de Traefik pour un appel interne.
    # « web » : routage public Traefik du site lui-même.
    networks: [internal, web]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.${STACK:-lehno}-web.rule=Host(`${WEB_DOMAIN}`) || Host(`www.${WEB_DOMAIN}`)
      - traefik.http.routers.${STACK:-lehno}-web.entrypoints=websecure
      - traefik.http.routers.${STACK:-lehno}-web.tls.certresolver=le
      - traefik.http.services.${STACK:-lehno}-web.loadbalancer.server.port=3000

  # ── Sauvegarde de la base (vidage nocturne vers R2) ────────────────────────
  #
  # Modèle repris du sidecar de gabee, éprouvé depuis six semaines sur ce même
  # VPS — avec sa purge corrigée : `aws s3 rm` n'accepte pas `--no-progress`,
  # et le passer faisait remonter chaque nuit RÉUSSIE comme un échec. Voir
  # ops/backup/bin/backup-once.
  #
  # LES VARIABLES SONT PRÉFIXÉES, et ce n'est pas de la cosmétique : Lehno
  # emploie déjà R2_BUCKET et R2_ACCESS_KEY_ID pour le stockage des IMAGES.
  # Réutiliser ces noms ferait écrire les sauvegardes dans le compartiment des
  # portraits, avec les clés des portraits. Deux jetons distincts permettent en
  # outre de cloisonner : celui des images ne peut pas toucher aux sauvegardes.
  backup:
    build:
      context: ./ops/backup
    image: ${REGISTRY:-ghcr.io/iamvaln}/lehno-backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # L'adresse se dérive de l'identifiant de compte, comme le fait déjà
      # app.module.ts pour le stockage des images : une variable de moins à
      # poser, et une forme de moins à retenir de travers.
      BACKUP_R2_ACCOUNT_ID: ${BACKUP_R2_ACCOUNT_ID}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET}
      BACKUP_R2_PREFIX: ${BACKUP_R2_PREFIX:-backups}
      # Le SDK d'AWS lit les identifiants sous CES noms-là : on y projette les
      # nôtres ici, pour que les variables du fichier d'environnement restent
      # lisibles et distinctes de celles du stockage d'images.
      AWS_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY}
      BACKUP_SCHEDULE_HOUR_UTC: ${BACKUP_SCHEDULE_HOUR_UTC:-3}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    depends_on:
      db:
        condition: service_healthy
    # « internal » seulement : il parle à la base et à R2 par sortie réseau. Il
    # n'a rien à exposer, donc aucune étiquette Traefik.
    networks: [internal]

  # ── Back-office (Vite, fichiers statiques servis par nginx) ─────────────────
  #
  # Il n'existait sur aucun serveur : le back-office ne tournait que sur les
  # machines de développement, et administrer le service demandait de cloner le
  # dépôt. Les drapeaux ont dû être basculés en SQL faute d'écran.
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    image: ${REGISTRY:-ghcr.io/iamvaln}/lehno-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # PAS de env_file : rien n'est lu à l'exécution. VITE_API_URL est gravée
    # dans le paquet au build, comme les NEXT_PUBLIC_* du site. Donner à ce
    # conteneur le fichier qui porte les secrets du serveur les exposerait dans
    # un processus qui n'a aucun usage d'aucun d'eux.
    #
    # PAS de dépendance à l'api non plus : ces fichiers se servent même api
    # éteinte, et l'écran dira lui-même ce qui ne répond pas. Attendre l'api
    # rendrait le back-office indisponible au moment précis où l'on vient
    # regarder pourquoi elle ne va pas.
    #
    # « web » seulement : ce conteneur ne parle à rien d'autre. Le navigateur
    # appelle api.lehno.io directement, autorisé par la liste d'origines de
    # l'api — pas par un relais ici, qui doublerait la décision.
    networks: [web]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.${STACK:-lehno}-admin.rule=Host(`admin.${WEB_DOMAIN}`)
      - traefik.http.routers.${STACK:-lehno}-admin.entrypoints=websecure
      - traefik.http.routers.${STACK:-lehno}-admin.tls.certresolver=le
      - traefik.http.services.${STACK:-lehno}-admin.loadbalancer.server.port=80

volumes:
  lehno-db:

networks:
  internal: # privé : db ↔ migrate ↔ api ↔ web (appel serveur à serveur)
  web: # réseau partagé du proxy (créé une fois : `docker network create web`)
    external: true
