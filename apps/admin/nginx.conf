# Le back-office est un tas de fichiers figés, servis tels quels.
#
# Il ne fait AUCUN relais vers l'API : le navigateur appelle api.lehno.io
# directement, et c'est la liste d'origines de l'api (apps/api/src/common/cors.ts)
# qui autorise ce domaine. Ajouter un relais ici doublerait cette décision à
# deux endroits, et l'un des deux finirait par diverger.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # LES EN-TÊTES SE RÉPÈTENT DANS CHAQUE BLOC, ET CE N'EST PAS UNE MALADRESSE.
    #
    # `add_header` ne s'hérite pas : dès qu'un bloc `location` en pose un seul,
    # il ANNULE tous ceux du niveau au-dessus. Déclarés une fois au niveau du
    # serveur, ils disparaissaient donc partout — vérifié sur l'image
    # construite, zéro `X-Frame-Options` sur la racine comme sur les assets.
    #
    # Le piège est silencieux : la configuration se lit bien, nginx démarre sans
    # se plaindre, et il faut interroger les en-têtes pour s'en apercevoir.
    # D'où le fichier de directives commun, inclus partout où l'on en pose.

    location / {
        # Le repli d'application d'une seule page. Sans lui, un rechargement sur
        # /utilisateurs répondrait 404 : la page marche à la première visite et
        # casse au rafraîchissement — un défaut qui se découvre tard, parce que
        # personne ne recharge en développement.
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/entetes.conf;
    }

    # Les fichiers versionnés par leur empreinte ne changent jamais sous le
    # même nom : les garder un an évite de les retélécharger à chaque visite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/conf.d/entetes.conf;
    }

    # index.html, lui, ne se met JAMAIS en cache. C'est lui qui nomme les
    # empreintes des autres fichiers : mis en cache, il continuerait à
    # réclamer ceux de la version d'avant après un déploiement, et l'écran
    # resterait sur l'ancienne application sans que rien ne le dise.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/entetes.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
