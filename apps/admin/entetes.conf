# Les en-têtes de sécurité du back-office, inclus dans CHAQUE bloc `location`.
#
# Pourquoi un fichier séparé plutôt qu'une déclaration unique au niveau du
# serveur : `add_header` ne s'hérite pas. Dès qu'un bloc en pose un — ne
# serait-ce qu'un `Cache-Control` —, il annule tous ceux du niveau au-dessus.
# Déclarés une seule fois plus haut, ils ne sortaient nulle part.
#
# `always` : sans lui, l'en-tête n'accompagne que les réponses 2xx et 3xx. Une
# page d'erreur en serait dépourvue, et c'est justement celle qu'un attaquant
# cherche à faire apparaître dans un cadre.

# Le back-office n'a rien à faire dans le cadre d'une autre page : c'est ce qui
# empêche qu'on superpose une page piège au-dessus de ses boutons.
add_header X-Frame-Options "DENY" always;

# Un fichier servi ne doit pas être deviné par son contenu : un type mal deviné
# transforme un téléversement en script exécuté par le navigateur.
add_header X-Content-Type-Options "nosniff" always;

# L'adresse d'une page d'administration ne part pas chez les tiers qu'elle
# pourrait joindre — elle nomme souvent l'objet qu'on regarde.
add_header Referrer-Policy "no-referrer" always;
